/* ---------- 温度滑块交互 ---------- */
// 状态配置：冰（solid）/ 水（liquid）/ 水蒸气（gas）
const TEMP_STATES = [
  { max: 0,  name: "Ice",         sub: "solid state",        icon: "🧊", key: "solid" },
  { max: 100, name: "Water",      sub: "liquid state",       icon: "💧", key: "liquid" },
  { max: Infinity, name: "Steam", sub: "gas state (water vapour)", icon: "💨", key: "gas" }
];

// 粒子排列坐标（百分比位置，12 颗粒子）
const PARTICLE_POS = {
  solid:  [[15,22],[35,18],[55,22],[75,18],[18,45],[38,45],[58,45],[78,45],[22,70],[42,70],[62,70],[82,70]],
  liquid: [[20,25],[42,20],[65,28],[80,22],[25,48],[48,45],[70,50],[88,44],[30,70],[55,72],[75,68],[15,55]],
  gas:    [[8,15],[28,8],[52,12],[74,7],[88,18],[15,40],[40,35],[60,42],[82,38],[25,68],[55,72],[80,66]]
};

function tempStateFor(t) {
  return TEMP_STATES.find((s) => t <= s.max) || TEMP_STATES[TEMP_STATES.length - 1];
}

function initTempSlider(root) {
  const range = root.querySelector("input[type=range]");
  const icon = root.querySelector(".temp-state-icon");
  const nameEl = root.querySelector(".temp-state-name");
  const subEl = root.querySelector(".temp-state-sub");
  const valEl = root.querySelector(".temp-val");
  const energyEl = root.querySelector(".temp-energy");
  const particles = root.querySelector(".temp-particles");
  if (!range) return;

  let lastT = Number(range.value);

  function render() {
    const t = Number(range.value);
    const st = tempStateFor(t);

    icon.textContent = st.icon;
    nameEl.textContent = st.name;
    subEl.textContent = st.sub;
    valEl.textContent = `${t} °C`;

    // 能量：温度升高 = absorbed，降低 = released
    if (t > lastT) {
      energyEl.textContent = "Energy: absorbed 🔥";
      energyEl.className = "temp-energy is-absorbed";
    } else if (t < lastT) {
      energyEl.textContent = "Energy: released ❄️";
      energyEl.className = "temp-energy is-released";
    } else {
      energyEl.textContent = "Energy: drag to explore";
      energyEl.className = "temp-energy is-idle";
    }
    lastT = t;

    // 粒子排列
    const pos = PARTICLE_POS[st.key];
    particles.innerHTML = pos.map((p) =>
      `<i class="${st.key === "gas" ? "is-gas" : ""}" style="left:${p[0]}%;top:${p[1]}%"></i>`
    ).join("");
  }

  range.addEventListener("input", render);
  render();
}

/* ---------- 拖拽匹配游戏 ---------- */
function initMatchGame(root) {
  const terms = Array.from(root.querySelectorAll(".match-term"));
  const slots = Array.from(root.querySelectorAll(".match-slot"));
  const termCol = root.querySelector(".match-col");
  const countEl = root.querySelector(".match-count b");
  const doneEl = root.querySelector(".match-done");
  const resetBtn = root.querySelector(".match-reset");
  if (!terms.length || !slots.length) return;

  let matched = 0;
  let selectedTerm = null;
  let draggingId = null;

  const shuffleTerms = () => {
    const order = [...terms].sort(() => Math.random() - 0.5);
    order.forEach((t) => termCol.appendChild(t));
  };

  const refreshCount = () => {
    countEl.textContent = String(matched);
    if (matched >= slots.length) doneEl.classList.add("is-show");
  };

  const setMatched = (term, slot) => {
    const text = term.getAttribute("data-term");
    const desc = slot.getAttribute("data-slot");
    term.classList.remove("is-selected");
    term.classList.add("is-matched");
    term.setAttribute("draggable", "false");
    slot.classList.remove("is-over");
    slot.classList.add("is-matched");
    slot.innerHTML = `<span class="match-slot__desc">✔ ${escapeHTML(text)} · ${escapeHTML(desc)}</span>`;
    matched += 1;
    refreshCount();
  };

  const tryMatch = (term, slot) => {
    if (!term || term.classList.contains("is-matched")) return;
    if (slot.classList.contains("is-matched")) return;
    if (term.getAttribute("data-match-term") === slot.getAttribute("data-match-slot")) {
      setMatched(term, slot);
    } else {
      slot.classList.add("is-wrong");
      setTimeout(() => slot.classList.remove("is-wrong"), 450);
    }
  };

  terms.forEach((term) => {
    term.addEventListener("dragstart", (e) => {
      draggingId = term.getAttribute("data-match-term");
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", draggingId); } catch (err) { /* 忽略 */ }
      term.classList.add("is-dragging");
    });
    term.addEventListener("dragend", () => {
      term.classList.remove("is-dragging");
      draggingId = null;
    });
    term.addEventListener("click", () => {
      if (term.classList.contains("is-matched")) return;
      if (selectedTerm === term) {
        term.classList.remove("is-selected");
        selectedTerm = null;
      } else {
        if (selectedTerm) selectedTerm.classList.remove("is-selected");
        selectedTerm = term;
        term.classList.add("is-selected");
      }
    });
  });

  slots.forEach((slot) => {
    slot.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      slot.classList.add("is-over");
    });
    slot.addEventListener("dragleave", () => slot.classList.remove("is-over"));
    slot.addEventListener("drop", (e) => {
      e.preventDefault();
      slot.classList.remove("is-over");
      const id = e.dataTransfer.getData("text/plain") || draggingId;
      const term = terms.find((t) => t.getAttribute("data-match-term") === id);
      tryMatch(term, slot);
    });
    slot.addEventListener("click", () => {
      if (slot.classList.contains("is-matched")) return;
      if (selectedTerm) {
        tryMatch(selectedTerm, slot);
        selectedTerm.classList.remove("is-selected");
        selectedTerm = null;
      }
    });
  });

  resetBtn.addEventListener("click", () => {
    matched = 0;
    selectedTerm = null;
    draggingId = null;
    doneEl.classList.remove("is-show");
    countEl.textContent = "0";
    terms.forEach((t) => {
      t.classList.remove("is-matched", "is-selected", "is-dragging");
      t.setAttribute("draggable", "true");
    });
    slots.forEach((s) => {
      s.classList.remove("is-matched", "is-over", "is-wrong");
      s.innerHTML = `<span class="match-slot__desc">${escapeHTML(s.getAttribute("data-slot"))}</span>`;
    });
    shuffleTerms();
  });

  shuffleTerms();
}

/* ---------- Science 折叠面板 ---------- */
function initAcc(root) {
  const head = root.querySelector(".acc-head");
  const body = root.querySelector(".acc-body");
  if (!head || !body) return;
  head.addEventListener("click", () => {
    const open = head.getAttribute("aria-expanded") === "true";
    head.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });
}

/* ---------- Science 折线图动画 ---------- */
function initChart(root) {
  const replay = root.querySelector(".chart-replay");
  let played = false;
  const play = () => {
    root.classList.remove("is-anim");
    void root.offsetWidth; // 强制重排以重启动画
    root.classList.add("is-anim");
  };
  if (replay) replay.addEventListener("click", play);
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting && !played) { played = true; play(); }
      });
    }, { threshold: 0.4 });
    io.observe(root);
  } else {
    play();
  }
}

/* ---------- Science 标签页切换 ---------- */
function initTabs(root) {
  const buttons = root.querySelectorAll(".sci-tab");
  const panels = root.querySelectorAll(".sci-tabpanel");
  if (!buttons.length) return;
  buttons.forEach((btn) => {
    btn.addEventListener("click", () => {
      const targetId = btn.getAttribute("data-tab-target");
      panels.forEach((p) => { p.hidden = true; });
      const target = document.getElementById(targetId);
      if (target) target.hidden = false;
      buttons.forEach((b) => b.setAttribute("aria-selected", String(b === btn)));
    });
  });
}

/* ---------- Science 交互式总结表格 ---------- */
function initSummaryTable(root) {
  const selects = root.querySelectorAll(".st-select");
  const checkBtn = root.querySelector(".st-check");
  const result = root.querySelector(".st-result");
  if (!checkBtn || !selects.length) return;
  checkBtn.addEventListener("click", () => {
    let correct = 0;
    selects.forEach((sel) => {
      const answer = sel.getAttribute("data-answer");
      const val = sel.value;
      const ok = val === answer;
      if (ok) correct++;
      sel.classList.toggle("is-correct", ok);
      sel.classList.toggle("is-wrong", val !== "" && !ok);
    });
    result.hidden = false;
    result.textContent = `${correct} / ${selects.length} correct`;
    result.classList.toggle("is-all", correct === selects.length);
  });
}

/* ---------- Science 章节测验 ---------- */
function initQuiz(root) {
  const submitBtn = root.querySelector(".cq-submit");
  const result = root.querySelector(".cq-result");
  const questions = root.querySelectorAll(".qq");
  if (!submitBtn) return;

  submitBtn.addEventListener("click", () => {
    let score = 0;
    questions.forEach((q) => {
      const answer = Number(q.getAttribute("data-answer"));
      const checked = q.querySelector('input[type=radio]:checked');
      const opts = q.querySelectorAll(".qq-opt");
      const fb = q.querySelector(".qq-feedback");
      const ok = checked ? Number(checked.value) === answer : false;
      if (ok) score++;

      opts.forEach((opt, oi) => {
        const input = opt.querySelector("input");
        const isCorrect = oi === answer;
        opt.classList.toggle("is-correct", isCorrect);
        opt.classList.toggle("is-wrong", input.checked && !isCorrect);
        input.disabled = true;
      });

      fb.hidden = false;
      fb.className = "qq-feedback " + (ok ? "is-ok" : "is-bad");
      fb.textContent = ok ? "✓ Correct" : `✗ Correct answer: ${String.fromCharCode(65 + answer)}`;
    });

    const dragMatched = root.querySelectorAll(".match-term.is-matched").length;
    const dragTotal = root.querySelectorAll(".match-term").length;
    const total = questions.length + dragTotal;
    const earned = score + dragMatched;

    result.hidden = false;
    result.innerHTML = `
      <div class="cq-score">${earned} / ${total}</div>
      <div class="cq-score-sub">Multiple choice: ${score}/${questions.length} · Drag &amp; drop: ${dragMatched}/${dragTotal}</div>
      <div class="cq-score-msg">${earned === total ? "🎉 Perfect! Excellent work!" : earned >= total * 0.6 ? "👍 Good job! Review the marked answers." : "💪 Keep practising — check the notes and try again."}</div>`;

    submitBtn.disabled = true;
    submitBtn.textContent = "✅ Submitted";
    result.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
}

/* ---------- Science 分节客观题测验（Section A/B） ---------- */
function initQuizSet(root) {
  const submitBtn = root.querySelector(".qz-submit");
  const result = root.querySelector(".qz-result");
  if (!submitBtn) return;

  // T/F 按钮：互斥选中
  root.querySelectorAll(".qz-tf-btns").forEach((group) => {
    group.querySelectorAll(".qz-tf-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (btn.disabled) return;
        group.querySelectorAll(".qz-tf-btn").forEach((b) => b.classList.remove("is-on"));
        btn.classList.add("is-on");
      });
    });
  });

  submitBtn.addEventListener("click", () => {
    let total = 0;
    let correct = 0;

    // 1) 下拉选择（照片匹配 / 选词填空 / 填图 / 填表）
    root.querySelectorAll("select.qz-sel[data-answer]").forEach((sel) => {
      total++;
      const ok = sel.value === sel.getAttribute("data-answer");
      if (ok) correct++;
      sel.classList.toggle("is-correct", ok);
      sel.classList.toggle("is-wrong", !ok);
      sel.disabled = true;
    });

    // 2) 单选题（含粒子图）
    root.querySelectorAll(".qz-mc[data-answer]").forEach((q) => {
      total++;
      const ans = Number(q.getAttribute("data-answer"));
      const checked = q.querySelector('input[type=radio]:checked');
      const ok = checked ? Number(checked.value) === ans : false;
      if (ok) correct++;
      q.querySelectorAll(".qz-opt, .qz-particle-opt").forEach((opt, oi) => {
        const inp = opt.querySelector("input");
        const isCorrect = oi === ans;
        opt.classList.toggle("is-correct", isCorrect);
        opt.classList.toggle("is-wrong", !!inp && inp.checked && !isCorrect);
        if (inp) inp.disabled = true;
      });
      const fb = q.querySelector(".qz-fb");
      if (fb) {
        fb.hidden = false;
        fb.className = "qz-fb " + (ok ? "is-ok" : "is-bad");
        fb.textContent = ok ? "✓ Correct" : `✗ Correct answer: ${String.fromCharCode(65 + ans)}`;
      }
    });

    // 3) 判断题 T/F
    root.querySelectorAll(".qz-tf-btns[data-answer]").forEach((group) => {
      total++;
      const ans = group.getAttribute("data-answer");
      const on = group.querySelector(".qz-tf-btn.is-on");
      const ok = on ? on.getAttribute("data-val") === ans : false;
      if (ok) correct++;
      group.querySelectorAll(".qz-tf-btn").forEach((b) => {
        const good = b.getAttribute("data-val") === ans;
        b.classList.toggle("is-correct", good);
        b.classList.toggle("is-wrong", b.classList.contains("is-on") && !good);
        b.disabled = true;
      });
    });

    const pct = total ? Math.round((correct / total) * 100) : 0;
    result.hidden = false;
    result.innerHTML = `
      <div class="qz-score">${correct} / ${total}</div>
      <div class="qz-score-sub">Objective marks earned out of ${total}</div>
      <div class="qz-score-msg">${correct === total ? "🎉 Perfect! Excellent work!" : pct >= 60 ? "👍 Good job! Review the marked answers." : "💪 Keep practising — check the notes and try again."}</div>`;
    submitBtn.disabled = true;
    submitBtn.textContent = "✅ Submitted";
    result.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
}

/* ---------- 图片灯箱（全局委托，绑定一次；支持单图 + 多图画廊） ---------- */
(function initLightbox() {
  const lb = document.getElementById("lightbox");
  if (!lb) return;
  const img = lb.querySelector("img");
  const cap = lb.querySelector(".lightbox__caption");
  const countEl = lb.querySelector(".lightbox__count");
  const prevBtn = lb.querySelector(".lightbox__prev");
  const nextBtn = lb.querySelector(".lightbox__next");

  let gallery = [];
  let index = 0;

  const renderItem = () => {
    const it = gallery[index];
    if (!it) return;
    img.src = it.src;
    cap.textContent = it.cap || "";
    const multi = gallery.length > 1;
    countEl.textContent = multi ? `${index + 1} / ${gallery.length}` : "";
    countEl.hidden = !multi;
    prevBtn.hidden = !multi;
    nextBtn.hidden = !multi;
  };

  const open = (items, startIndex) => {
    gallery = Array.isArray(items) && items.length ? items : [];
    if (!gallery.length) return;
    index = Math.max(0, Math.min(startIndex || 0, gallery.length - 1));
    renderItem();
    lb.classList.add("is-show");
    lb.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  };

  const close = () => {
    lb.classList.remove("is-show");
    lb.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    img.removeAttribute("src");
    cap.textContent = "";
    countEl.textContent = "";
    gallery = [];
    index = 0;
  };

  const step = (d) => {
    if (gallery.length <= 1) return;
    index = (index + d + gallery.length) % gallery.length;
    renderItem();
  };

  document.addEventListener("click", (e) => {
    const fig = e.target.closest("[data-lightbox]");
    if (fig) {
      open([{ src: fig.getAttribute("data-lightbox"), cap: fig.getAttribute("data-cap") || "" }], 0);
      return;
    }
    const gal = e.target.closest("[data-gallery]");
    if (gal) {
      let items = [];
      try { items = JSON.parse(gal.getAttribute("data-gallery") || "[]"); } catch (err) { items = []; }
      open(items, 0);
      return;
    }
    if (e.target.closest(".lightbox__close")) { close(); return; }
    if (e.target.closest(".lightbox__prev")) { step(-1); return; }
    if (e.target.closest(".lightbox__next")) { step(1); return; }
    if (e.target === lb) close();
  });

  document.addEventListener("keydown", (e) => {
    if (!lb.classList.contains("is-show")) return;
    if (e.key === "Escape") { close(); return; }
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });
})();

// 为站内相对链接自动附加 sharecode（如 s1-ict-quiz.html），
// 保证发布后的子页面在分享链接下也能正常访问；本地 file:// 打开时不受影响。
function attachShareCode() {
  const sc = new URLSearchParams(location.search).get("sharecode");
  if (!sc) return;
  document.querySelectorAll("a[data-keep-share]").forEach((a) => {
    const base = a.getAttribute("href");
    if (!base) return;
    try {
      const url = new URL(base, location.href);
      url.searchParams.set("sharecode", sc);
      a.setAttribute("href", url.pathname + url.search + url.hash);
    } catch (e) {
      /* 忽略非法链接 */
    }
  });
}

const body = document.body;
function openDrawer() {
  body.classList.add("drawer-open");
  $("#backdrop").hidden = false;
  $("#hamburger").setAttribute("aria-expanded", "true");
}
function closeDrawer() {
  body.classList.remove("drawer-open");
  $("#hamburger").setAttribute("aria-expanded", "false");
  const bd = $("#backdrop");
  if (!body.classList.contains("drawer-open")) {
    setTimeout(() => { if (!body.classList.contains("drawer-open")) bd.hidden = true; }, 240);
  }
}
$("#hamburger").addEventListener("click", () => {
  body.classList.contains("drawer-open") ? closeDrawer() : openDrawer();
});
$("#sidebarClose").addEventListener("click", closeDrawer);
$("#backdrop").addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
window.addEventListener("resize", () => { if (window.innerWidth > 900) closeDrawer(); });
