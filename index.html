<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>学习门户 · 多学科分年级学习平台</title>
<style>
  :root{
    --bg:#f4f7fc;
    --card:#ffffff;
    --ink:#16202e;
    --ink-2:#404f63;
    --muted:#77879c;
    --line:#e6ecf5;
    --brand:#2f6bff;
    --brand-ink:#1f4fd8;
    --brand-soft:#eaf0ff;
    --teal:#00a896;
    --amber:#f59f0b;
    --radius:16px;
    --shadow:0 6px 20px rgba(22,32,46,.06);
    --shadow-hover:0 10px 28px rgba(22,32,46,.10);
    --sidebar-w:268px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"PingFang SC","PingFang HK","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:
      radial-gradient(1200px 500px at 10% -10%, #e8f0ff 0%, rgba(232,240,255,0) 60%),
      radial-gradient(900px 420px at 100% 0%, #e6fbf7 0%, rgba(230,251,247,0) 55%),
      var(--bg);
    color:var(--ink);
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit}
  button{font-family:inherit}

  /* ---------- 顶部导航栏 ---------- */
  .topbar{
    position:sticky;top:0;z-index:60;
    background:rgba(255,255,255,.88);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  .topbar__inner{
    max-width:1280px;margin:0 auto;
    padding:12px 24px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .hamburger{
    display:none;
    width:40px;height:40px;flex:0 0 auto;
    border:1px solid var(--line);border-radius:12px;
    background:#fff;color:var(--ink-2);
    font-size:18px;line-height:1;cursor:pointer;
    align-items:center;justify-content:center;
    transition:background .18s,border-color .18s;
  }
  .hamburger:hover{background:#f5f8ff;border-color:#cddcff}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .brand__logo{
    width:38px;height:38px;flex:0 0 auto;border-radius:11px;
    background:linear-gradient(140deg,#2f6bff,#5b8dff 55%,#00b8a9);
    color:#fff;font-weight:700;font-size:17px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px rgba(47,107,255,.28);
    letter-spacing:.5px;
  }
  .brand__text{min-width:0}
  .brand__title{font-weight:700;font-size:16.5px;letter-spacing:.2px;white-space:nowrap}
  .brand__sub{font-size:12px;color:var(--muted);white-space:nowrap;margin-top:-1px}

  .grade-box{margin-left:auto;display:flex;align-items:center;gap:10px}
  .grade-box__label{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .grade-switch{
    display:flex;gap:4px;padding:4px;border-radius:999px;
    background:#eef2f9;border:1px solid #e7edf8;
    overflow-x:auto;scrollbar-width:none;
  }
  .grade-switch::-webkit-scrollbar{display:none}
  .grade-btn{
    border:0;background:transparent;color:var(--ink-2);
    padding:7px 15px;border-radius:999px;
    font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
    transition:background .18s,color .18s,box-shadow .18s;
  }
  .grade-btn:hover{color:var(--brand-ink)}
  .grade-btn[aria-current="true"]{
    background:#fff;color:var(--brand-ink);
    box-shadow:0 2px 8px rgba(31,79,216,.16);
  }

  /* ---------- 布局 ---------- */
  .layout{
    max-width:1280px;margin:0 auto;
    padding:22px 24px 56px;
    display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);
    gap:22px;align-items:start;
  }

  /* ---------- 左侧边栏 ---------- */
  .sidebar{
    position:sticky;top:78px;
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 12px 14px;
    max-height:calc(100vh - 100px);overflow-y:auto;
  }
  .sidebar__head{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 6px 10px;
  }
  .sidebar__title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1.2px}
  .sidebar__close{
    display:none;border:0;background:#f1f5fd;color:var(--ink-2);
    width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px;
  }
  .nav-group{margin-bottom:12px}
  .nav-group:last-child{margin-bottom:0}
  .nav-group__label{
    font-size:11.5px;font-weight:700;color:#9aa8bc;
    letter-spacing:1.4px;padding:8px 10px 6px;
    display:flex;align-items:center;gap:7px;
  }
  .nav-group__label::after{
    content:"";flex:1;height:1px;background:linear-gradient(90deg,#eef2f9,rgba(238,242,249,0));
  }
  .nav-item{
    width:100%;display:flex;align-items:center;gap:10px;
    padding:9px 11px;margin-bottom:2px;
    border:1px solid transparent;border-radius:11px;
    background:transparent;color:var(--ink-2);
    font-size:14.5px;font-weight:500;text-align:left;cursor:pointer;
    transition:background .16s,color .16s,border-color .16s,transform .16s;
  }
  .nav-item__icon{
    width:24px;height:24px;flex:0 0 auto;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:13.5px;background:#f2f6ff;
  }
  .nav-item__name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-item__dot{
    width:6px;height:6px;border-radius:50%;background:var(--brand);opacity:0;flex:0 0 auto;
  }
  .nav-item:hover{background:#f5f8ff;color:var(--brand-ink)}
  .nav-item[aria-current="true"]{
    background:linear-gradient(96deg,#eef4ff,#f4f9ff);
    border-color:#d5e2ff;color:var(--brand-ink);font-weight:700;
    box-shadow:inset 0 0 0 1px rgba(47,107,255,.04);
  }
  .nav-item[aria-current="true"] .nav-item__icon{background:#dfeaff}
  .nav-item[aria-current="true"] .nav-item__dot{opacity:1}

  /* Science 章节跳转卡片（指向独立笔记/测验页） */

  /* ---------- 主内容区 ---------- */
  .main{min-width:0}
  .page-head{margin-bottom:16px}
  .crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .crumb b{color:var(--ink-2);font-weight:600}
  .page-title{
    margin:0;font-size:23px;font-weight:800;letter-spacing:.2px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .pill{
    font-size:11.5px;font-weight:700;letter-spacing:.4px;
    padding:3px 9px;border-radius:999px;
    background:var(--brand-soft);color:var(--brand-ink);
  }
  .pill--green{background:#e6f8f4;color:#00877a}
  .page-desc{color:var(--muted);font-size:13.5px;margin-top:6px}
  .page-actions{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px}
  .page-actions .btn{white-space:normal;text-align:center}

  .cards{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
  }
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:20px;position:relative;
    transition:box-shadow .22s,transform .22s,border-color .22s;
  }
  .card:hover{box-shadow:var(--shadow-hover);border-color:#dbe6f8}
  .card--wide{grid-column:1 / -1}
  .card__head{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
  .card__icon{
    width:40px;height:40px;flex:0 0 auto;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:19px;
    background:linear-gradient(140deg,#eef4ff,#e7f7f4);
  }
  .card__titles{min-width:0}
  .card__title{margin:0;font-size:16.5px;font-weight:750}
  .card__sub{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .card__body{margin-top:14px}

  /* 课文条目 */
  .lessons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .lesson{
    border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(180deg,#fbfdff,#f7fbff);
    padding:14px;
    display:flex;flex-direction:column;gap:12px;
    transition:border-color .2s,box-shadow .2s;
  }
  .lesson:hover{border-color:#cfdffb;box-shadow:0 4px 14px rgba(47,107,255,.07)}
  .lesson__head{display:flex;align-items:flex-start;gap:10px;min-width:0}
  .lesson__no{
    width:26px;height:26px;flex:0 0 auto;border-radius:9px;
    background:#e8f0ff;color:var(--brand-ink);
    font-size:12.5px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }
  .lesson__title{font-size:16px;font-weight:750;letter-spacing:.2px;line-height:1.4}
  .lesson__meta{font-size:12px;color:var(--muted);margin-top:1px}
  .lesson__actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .lesson__actions .btn--primary{flex:1 1 150px}

  /* 每篇课文的长题目挑战区 */
  .challenge{
    border:1px solid #e3ecf9;border-left:3px solid #7aa7ff;
    border-radius:11px;background:#fff;
    padding:11px 13px;
    display:flex;flex-direction:column;gap:9px;
  }
  .challenge__label{
    font-size:11px;font-weight:800;letter-spacing:1.1px;color:#4176d4;
    display:inline-flex;align-items:center;gap:5px;
  }
  .challenge__label::before{content:"✎";font-size:12.5px}
  .challenge__q{
    margin:0;font-size:13.5px;line-height:1.6;font-weight:600;color:var(--ink-2);
    background:#f8fbff;border-radius:8px;padding:8px 10px;
  }
  .challenge__q b{color:var(--brand-ink);font-weight:800;margin-right:4px}
  .challenge .btn{align-self:flex-start}

  /* 文言助读专项训练板块 */
  .practice{
    border:1px solid #e9e2f8;border-left:3px solid #9b7fe8;
    border-radius:11px;background:#fff;
    padding:11px 13px;
    display:flex;flex-direction:column;gap:9px;
  }
  .practice__label{
    font-size:11px;font-weight:800;letter-spacing:1.1px;color:#6a4fd0;
    display:inline-flex;align-items:center;gap:6px;
  }
  .practice__label::before{content:"📘";font-size:12.5px}
  .practice .btn{align-self:flex-start}

  /* ICT 章节卡片 */
  .chapters{display:flex;flex-direction:column;gap:14px}
  .chapter-card{
    border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(180deg,#fbfdff,#f7fbff);
    padding:16px;
    display:flex;flex-direction:column;gap:12px;
  }
  .chapter-head{display:flex;align-items:center;gap:10px}
  .chapter-num{
    width:28px;height:28px;flex:0 0 auto;border-radius:9px;
    background:#e8f0ff;color:var(--brand-ink);
    font-size:13px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }
  .chapter-title{font-size:19px;font-weight:800;margin:0;letter-spacing:.2px;color:#1e3a8a}
  .chapter-empty{
    margin:0;font-size:13.5px;color:var(--muted);
    text-align:center;padding:18px 10px;
    border:1px dashed #dde6f5;border-radius:10px;
  }

  /* 折叠课文原文 */
  .btn--toggle-text{align-self:flex-start}
  .text-body{
    border:1px solid #e6ecf5;border-radius:12px;
    background:#fbfcff;padding:14px 16px;
    max-height:520px;overflow-y:auto;
    scrollbar-width:thin;
  }
  .text-h{
    font-size:16.5px;font-weight:800;color:#1e3a8a;
    margin:16px 0 10px;padding-bottom:7px;border-bottom:2px solid #dbe4f5;
  }
  .text-h:first-child{margin-top:0}
  .text-unit{
    font-size:13px;font-weight:700;color:#5b6f88;
    margin:0 0 8px;letter-spacing:.4px;
  }
  .text-para{
    margin:0 0 12px;font-size:14px;line-height:2.05;color:#1f2937;
  }
  .text-sub{
    font-size:15px;font-weight:800;color:#374151;
    margin:15px 0 7px;
  }
  .text-sub::before{content:"🔹 ";font-size:.85em}
  .text-sub3{
    font-size:14px;font-weight:800;color:#374151;
    margin:13px 0 5px;
  }
  .text-sub3::before{content:"🔹 ";font-size:.85em}
  .term{
    background:#fff3c4;color:#7c4a03;font-weight:750;
    padding:1px 4px;border-radius:4px;
    box-shadow:inset 0 -1px 0 #f1d06e;
  }

  /* Science 页码徽章 */
  .pg{
    display:inline-flex;align-items:center;
    margin-left:8px;padding:1px 9px;border-radius:999px;
    background:#eef4ff;border:1px solid #d7e4fb;color:#2f6bff;
    font-size:11.5px;font-weight:800;letter-spacing:.3px;
    white-space:nowrap;vertical-align:middle;
  }
  .sci-sec-head .pg{margin-left:0}

  /* Science 小节块 */
  .sci-section{
    border:1px solid #e3ecf9;border-radius:12px;background:#fff;overflow:hidden;
  }
  .sci-section+.sci-section{margin-top:12px}
  .sci-sec-head{
    display:flex;align-items:center;gap:10px;width:100%;
    padding:13px 15px;background:linear-gradient(180deg,#f7faff,#f2f7ff);
    border:0;cursor:pointer;text-align:left;
  }
  .sci-sec-num{
    flex:0 0 auto;min-width:34px;height:26px;padding:0 8px;border-radius:8px;
    background:#2f6bff;color:#fff;font-size:13px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }
  .sci-sec-title{flex:1;font-size:15px;font-weight:800;color:#1e3a8a}
  .sci-sec-caret{flex:0 0 auto;color:#7b8ba6;transition:transform .2s;font-size:13px}
  .sci-sec-head[aria-expanded="true"] .sci-sec-caret{transform:rotate(180deg)}
  .sci-sec-body{padding:14px 16px 16px;border-top:1px solid #edf2fb}

  /* Science 章节跳转卡片（指向独立笔记/测验页） */
  .sci-link-row{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:13px 15px;background:linear-gradient(180deg,#f7faff,#f2f7ff);
  }
  .sci-link-main{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
  .sci-link-actions{display:flex;gap:8px;flex-wrap:wrap;flex:0 0 auto}
  .sci-link-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;
    font-size:13px;font-weight:800;color:#1e3a8a;background:#eef4ff;
    border:1px solid #d5e2fb;border-radius:10px;padding:10px 17px;transition:.15s;
    min-height:40px;line-height:1;
  }
  .sci-link-btn:hover{background:#dbe7ff;border-color:#bcd0f2}
  .sci-link-btn--quiz{color:#fff;background:#2f6bff;border-color:#2f6bff}
  .sci-link-btn--quiz:hover{background:#1f4fd8;border-color:#1f4fd8}

  /* Science Checkpoint 醒目卡片 */
  .sci-section--checkpoint{margin:8px 0}
  .sci-checkpoint-card{
    display:flex;align-items:center;gap:14px;padding:16px 18px;text-decoration:none;
    background:linear-gradient(120deg,#fff7e0,#fff0c2);border:1.5px solid #f5c518;
    border-radius:14px;box-shadow:0 4px 14px rgba(245,197,24,.18);transition:.15s;
  }
  .sci-checkpoint-card:hover{border-color:#e0a800;box-shadow:0 6px 18px rgba(245,197,24,.3);transform:translateY(-1px)}
  .sci-checkpoint-icon{font-size:26px;line-height:1;flex:0 0 auto}
  .sci-checkpoint-text{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
  .sci-checkpoint-title{font-size:15.5px;font-weight:900;color:#8a5a00;letter-spacing:.2px}
  .sci-checkpoint-desc{font-size:12px;color:#a16207;font-weight:600}
  .sci-checkpoint-arrow{font-size:20px;color:#c8920a;font-weight:900;flex:0 0 auto}

  /* Science 关键点框 */
  .kp{
    border:1px solid #f3e2b0;border-left:3px solid #f0b429;
    background:#fffaf0;border-radius:10px;padding:10px 13px;
    margin:12px 0;font-size:13.5px;line-height:1.9;color:#5b4a16;
  }
  .kp b{color:#a16207}

  /* Science 课本原页对照 */
  .fig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px}
  .fig{
    margin:0;border:1px solid #e3ecf9;border-radius:11px;overflow:hidden;
    background:#fbfcff;cursor:zoom-in;
  }
  .fig img{display:block;width:100%;height:150px;object-fit:cover;object-position:top}
  .fig figcaption{
    padding:7px 9px;font-size:11.5px;color:#4b5b73;line-height:1.5;
    display:flex;align-items:center;gap:6px;justify-content:space-between;background:#fff;
  }
  .fig figcaption .pg{margin-left:0}

  /* Science 内嵌图（插入文字旁） */
  .fig-inline{
    margin:13px 0;border:1px solid #e3ecf9;border-radius:12px;
    background:#fbfcff;overflow:hidden;cursor:zoom-in;
  }
  .fig-inline img{display:block;width:100%;max-width:520px;margin:0 auto;height:auto}
  .fig-inline figcaption{
    padding:8px 11px;font-size:11.5px;color:#4b5b73;line-height:1.5;
    display:flex;align-items:center;gap:6px;justify-content:center;background:#fff;
    border-top:1px solid #eef3fb;
  }
  .fig-inline figcaption .pg{margin-left:0}

  /* Science 温度滑块 */
  .temp-slider{
    border:1px solid #dbe6f8;border-radius:14px;
    background:linear-gradient(180deg,#f7faff,#edf4ff);
    padding:16px;margin:15px 0;
  }
  .temp-head{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;
  }
  .temp-state{
    display:flex;align-items:center;gap:11px;
  }
  .temp-state-icon{
    width:46px;height:46px;flex:0 0 auto;border-radius:12px;
    background:#fff;border:1px solid #dbe6f8;
    display:flex;align-items:center;justify-content:center;font-size:24px;
    box-shadow:0 2px 8px rgba(47,107,255,.08);
  }
  .temp-state-name{font-size:18px;font-weight:800;color:#1e3a8a;line-height:1.1}
  .temp-state-sub{font-size:12px;color:#64748b}
  .temp-val{
    margin-left:auto;font-size:22px;font-weight:800;color:#0e7fc2;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .temp-energy{
    display:inline-flex;align-items:center;gap:6px;
    border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;
  }
  .temp-energy.is-absorbed{background:#fff1e6;color:#c05621;border:1px solid #fed7aa}
  .temp-energy.is-released{background:#e6f4ff;color:#0e7fc2;border:1px solid #bae6fd}
  .temp-energy.is-idle{background:#eef2f8;color:#64748b;border:1px solid #dde3ec}
  .temp-particles{
    position:relative;height:72px;margin:6px 0 12px;
    border:1px dashed #d5e2f6;border-radius:10px;background:#fff;
    overflow:hidden;
  }
  .temp-particles i{
    position:absolute;width:11px;height:11px;border-radius:50%;
    background:#2f6bff;opacity:.9;
    transform:translate(-50%,-50%);
    transition:left .35s cubic-bezier(.4,0,.2,1),top .35s cubic-bezier(.4,0,.2,1);
    box-shadow:0 1px 3px rgba(47,107,255,.35);
  }
  .temp-particles i.is-gas{width:8px;height:8px;opacity:.65}
  .temp-scale{
    display:flex;justify-content:space-between;font-size:11px;color:#64748b;
    margin:6px 2px 0;font-variant-numeric:tabular-nums;
  }
  .temp-slider input[type=range]{
    width:100%;height:24px;margin:4px 0 0;accent-color:#2f6bff;cursor:pointer;
  }
  .temp-hint{font-size:12px;color:#64748b;margin:8px 0 0;line-height:1.5}

  /* Science 拖拽匹配游戏 */
  .match-game{
    border:1px solid #dbe6f8;border-radius:14px;
    background:linear-gradient(180deg,#f7faff,#eef5ff);
    padding:16px;margin:15px 0;
  }
  .match-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .match-title{font-size:15px;font-weight:800;color:#1e3a8a}
  .match-count{
    margin-left:auto;font-size:12.5px;font-weight:700;color:#64748b;
    background:#fff;border:1px solid #dbe6f8;border-radius:999px;padding:4px 12px;
  }
  .match-reset{
    border:1px solid #dbe6f8;background:#fff;color:#2f6bff;font-weight:700;
    font-size:12.5px;border-radius:999px;padding:5px 12px;cursor:pointer;
  }
  .match-reset:hover{background:#2f6bff;color:#fff;border-color:#2f6bff}
  .match-board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.match-board{grid-template-columns:1fr}}
  .match-col{display:flex;flex-direction:column;gap:9px}
  .match-col__label{font-size:11.5px;font-weight:800;letter-spacing:.5px;color:#64748b;text-transform:uppercase}
  .match-term{
    border:1.5px solid #2f6bff;background:#fff;color:#1e3a8a;
    border-radius:10px;padding:10px 12px;font-weight:800;font-size:14px;
    cursor:grab;text-align:center;user-select:none;
    transition:transform .15s, box-shadow .15s, opacity .2s, background .15s;
    box-shadow:0 2px 6px rgba(47,107,255,.08);
  }
  .match-term:active{cursor:grabbing}
  .match-term.is-selected{transform:scale(1.04);box-shadow:0 6px 16px rgba(47,107,255,.28);background:#eaf1ff}
  .match-term.is-dragging{opacity:.45}
  .match-term.is-matched{background:#e6f6ec;border-color:#22a06b;color:#14683f;cursor:default;opacity:.95;pointer-events:none;box-shadow:none}
  .match-slot{
    border:1.5px dashed #c3d4f0;background:#fff;border-radius:10px;
    min-height:44px;padding:9px 12px;display:flex;align-items:center;gap:8px;
    transition:border-color .15s, background .15s, transform .15s;
    cursor:pointer;
  }
  .match-slot__desc{font-size:13.5px;color:#33415c;font-weight:600;line-height:1.35}
  .match-slot.is-over{border-color:#2f6bff;background:#eaf1ff;transform:scale(1.02)}
  .match-slot.is-matched{border-style:solid;border-color:#22a06b;background:#e6f6ec;cursor:default;pointer-events:none}
  .match-slot.is-wrong{animation:shake .4s;border-color:#e11d48;background:#fff1f2}
  @keyframes shake{
    0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}
  }
  .match-done{
    display:none;margin-top:12px;border-radius:10px;background:#e6f6ec;
    color:#14683f;font-weight:800;font-size:14px;padding:11px 14px;text-align:center;
    border:1px solid #b9e6cc;
  }
  .match-done.is-show{display:block}

  /* Science 折叠面板（Accordion） */
  .acc{
    border:1px solid #dbe6f8;border-radius:13px;background:#fff;
    margin:12px 0;overflow:hidden;
  }
  .acc-head{
    width:100%;display:flex;align-items:center;gap:10px;
    padding:13px 15px;border:0;background:#f7faff;cursor:pointer;
    text-align:left;transition:background .15s;
  }
  .acc-head:hover{background:#eef4ff}
  .acc-icon{font-size:20px;line-height:1;flex:0 0 auto}
  .acc-title{font-size:15px;font-weight:800;color:#1e3a8a;flex:0 1 auto}
  .acc-hint{
    margin-left:auto;font-size:11.5px;color:#64748b;font-weight:600;
    background:#fff;border:1px solid #dbe6f8;border-radius:999px;padding:3px 10px;
    white-space:nowrap;
  }
  .acc-caret{
    flex:0 0 auto;font-size:13px;color:#64748b;
    transition:transform .25s;line-height:1;
  }
  .acc-head[aria-expanded="true"] .acc-caret{transform:rotate(180deg)}
  .acc-body{
    padding:14px;border-top:1px solid #eef3fb;background:#fff;
  }
  .acc-body[hidden]{display:none}

  /* Science 互动实验区分栏（桌面左右、移动单列） */
  .lab-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;margin:14px 0;
  }
  @media(max-width:720px){
    .lab-grid{grid-template-columns:1fr;gap:12px}
  }
  .lab-grid .acc{margin:0}
  .lab-grid > .acc{height:fit-content}

  /* Science 课本原页查看按钮 */
  .gallery-btn{
    display:inline-flex;align-items:center;gap:10px;
    border:1px solid #2f6bff;background:#fff;color:#2f6bff;
    border-radius:11px;padding:11px 16px;font-weight:800;font-size:14px;
    cursor:pointer;transition:background .15s,color .15s;margin-top:4px;
  }
  .gallery-btn:hover{background:#2f6bff;color:#fff}
  .gallery-btn__count{
    font-size:11.5px;font-weight:700;background:#eaf1ff;border-radius:999px;
    padding:2px 9px;
  }
  .gallery-btn:hover .gallery-btn__count{background:rgba(255,255,255,.22)}

  /* Science 折线图动画（加热曲线） */
  .chart-block{
    border:1px solid #e3ecf9;border-radius:11px;background:#fff;padding:10px 8px 6px;
  }
  .chart-svg{display:block;width:100%;height:auto}
  .chart-cap{
    font-size:12px;color:#64748b;text-align:center;margin:4px 0 2px;line-height:1.5;
  }
  .chart-legend{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 2px;
  }
  .chart-legend span{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;color:#33415c;font-weight:600;
    background:#f7faff;border:1px solid #e3ecf9;border-radius:999px;padding:3px 10px;
  }
  .chart-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .chart-legend .leg-melt i{background:#22a06b}
  .chart-legend .leg-heat i{background:#2f6bff}
  .chart-legend .leg-boil i{background:#f59e0b}
  .chart-seg{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100}
  .chart-note{opacity:0}
  .chart-block.is-anim .chart-seg{animation:chartdraw .9s ease forwards}
  .chart-block.is-anim .chart-seg--2{animation-delay:.9s}
  .chart-block.is-anim .chart-seg--3{animation-delay:1.8s}
  .chart-block.is-anim .chart-seg--4{animation-delay:2.7s}
  .chart-block.is-anim .chart-seg--5{animation-delay:3.6s}
  .chart-block.is-anim .chart-note--melt{animation:chartfade .45s ease 1.75s forwards}
  .chart-block.is-anim .chart-note--boil{animation:chartfade .45s ease 3.55s forwards}
  @keyframes chartdraw{to{stroke-dashoffset:0}}
  @keyframes chartfade{to{opacity:1}}
  .chart-replay{
    display:block;margin:6px auto 2px;border:1px solid #dbe6f8;background:#f7faff;
    color:#2f6bff;font-weight:700;font-size:12px;border-radius:999px;padding:4px 12px;cursor:pointer;
  }
  .chart-replay:hover{background:#2f6bff;color:#fff;border-color:#2f6bff}

  /* Science 标签页（Tabs） */
  .sci-tabs{margin-top:2px}
  .sci-tabbar{
    display:flex;gap:6px;border-bottom:2px solid #e3ecf9;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .sci-tabbar::-webkit-scrollbar{display:none}
  .sci-tab{
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
    padding:11px 16px;border:0;background:transparent;cursor:pointer;
    font-size:14px;font-weight:700;color:#64748b;
    border-bottom:3px solid transparent;margin-bottom:-2px;
    transition:color .15s, border-color .15s;
  }
  .sci-tab:hover{color:#1e3a8a}
  .sci-tab[aria-selected="true"]{color:#2f6bff;border-bottom-color:#2f6bff}
  .sci-tab__icon{font-size:16px;line-height:1}
  .sci-tabpanel{padding-top:12px}
  .sci-tabpanel[hidden]{display:none}

  /* Science 交互式总结表格 */
  .summary-table{
    border:1px solid #e3ecf9;border-radius:12px;background:#fff;
    padding:14px;margin:12px 0;
  }
  .st-title{font-size:14.5px;font-weight:800;color:#1e3a8a;margin-bottom:10px}
  .st-wrap{overflow-x:auto}
  .st-table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
  .st-table th,.st-table td{
    border:1px solid #e3ecf9;padding:8px 10px;text-align:left;vertical-align:middle;
  }
  .st-table th{background:#f7faff;color:#1e3a8a;font-weight:800;font-size:12px}
  .st-table td{color:#33415c;line-height:1.4}
  .st-process{font-weight:800;color:#1e3a8a;white-space:nowrap}
  .st-energy{white-space:nowrap}
  .st-select{
    border:1.5px solid #c3d4f0;border-radius:8px;background:#fff;
    padding:5px 8px;font-size:12.5px;font-weight:700;color:#33415c;cursor:pointer;
  }
  .st-select.is-correct{border-color:#22a06b;background:#e6f6ec;color:#14683f}
  .st-select.is-wrong{border-color:#e11d48;background:#fff1f2;color:#be123c}
  .st-actions{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
  .st-check{
    border:1px solid #2f6bff;background:#2f6bff;color:#fff;font-weight:800;
    font-size:13px;border-radius:9px;padding:8px 16px;cursor:pointer;
  }
  .st-check:hover{background:#1e57d8;border-color:#1e57d8}
  .st-result{font-size:13.5px;font-weight:800;color:#33415c}
  .st-result.is-all{color:#14683f}

  /* Science 章节测验 */
  .chapter-quiz{
    border:1px solid #e3ecf9;border-radius:13px;background:#fff;
    padding:16px;margin:4px 0;
  }
  .cq-title{font-size:16px;font-weight:800;color:#1e3a8a;margin-bottom:4px}
  .cq-intro{font-size:13px;color:#64748b;margin-bottom:14px}
  .qq{border:1px solid #e8eff9;border-radius:11px;padding:13px 14px;margin-bottom:12px;background:#fbfcff}
  .qq-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .qq-num{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:50%;background:#2f6bff;color:#fff;
    font-size:12.5px;font-weight:800;flex:0 0 auto;
  }
  .qq-level{
    font-size:11px;font-weight:800;letter-spacing:.5px;color:#f59e0b;
    background:#fff7e6;border:1px solid #fde68a;border-radius:999px;padding:2px 9px;
  }
  .qq-text{font-size:14px;color:#1e293b;font-weight:600;line-height:1.5;margin-bottom:9px}
  .qq-options{display:flex;flex-direction:column;gap:7px}
  .qq-opt{
    display:flex;align-items:center;gap:9px;cursor:pointer;
    border:1.5px solid #e3ecf9;border-radius:9px;padding:8px 11px;
    transition:border-color .12s, background .12s;
  }
  .qq-opt:hover{border-color:#bcd0f2;background:#f5f9ff}
  .qq-opt input{accent-color:#2f6bff;margin:0}
  .qq-opt__label{font-size:13.5px;color:#33415c;font-weight:600}
  .qq-opt.is-correct{border-color:#22a06b;background:#e6f6ec}
  .qq-opt.is-correct .qq-opt__label{color:#14683f}
  .qq-opt.is-wrong{border-color:#e11d48;background:#fff1f2}
  .qq-opt.is-wrong .qq-opt__label{color:#be123c}
  .qq-feedback{font-size:12.5px;font-weight:700;margin-top:8px}
  .qq-feedback.is-ok{color:#14683f}
  .qq-feedback.is-bad{color:#be123c}
  .qq-graph-block{
    border:1px solid #e8eff9;border-radius:11px;background:#fbfcff;
    padding:10px;margin-bottom:14px;text-align:center;
  }
  .qq-graph{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
  .qq-graph-cap{font-size:12.5px;color:#64748b;line-height:1.5;margin-top:6px;text-align:left}
  .qq-drag{border-top:1px dashed #e3ecf9;margin-top:14px;padding-top:14px}
  .qq-drag-title{font-size:14.5px;font-weight:800;color:#1e3a8a;margin-bottom:8px}
  .cq-actions{margin-top:14px}
  .cq-submit{
    border:1px solid #22a06b;background:#22a06b;color:#fff;font-weight:800;
    font-size:14.5px;border-radius:10px;padding:11px 24px;cursor:pointer;
    width:100%;
  }
  .cq-submit:hover{background:#1a865a;border-color:#1a865a}
  .cq-submit:disabled{background:#94a3b8;border-color:#94a3b8;cursor:default}
  .cq-result{
    margin-top:14px;border:1px solid #e3ecf9;border-radius:12px;background:#f7faff;
    padding:16px;text-align:center;
  }
  .cq-score{font-size:34px;font-weight:900;color:#1e3a8a;line-height:1.1}
  .cq-score-sub{font-size:13px;color:#64748b;margin-top:6px}
  .cq-score-msg{font-size:14px;font-weight:700;color:#1e3a8a;margin-top:10px}

  /* Science 章节测验 · 分节客观题 */
  .qz-set{border:1px solid #e3ecf9;border-radius:13px;background:#fff;padding:16px;margin:4px 0}
  .qz-title{font-size:16px;font-weight:800;color:#1e3a8a;margin-bottom:4px}
  .qz-intro{font-size:13px;color:#64748b;margin-bottom:14px}
  .qz-section{border:1px solid #e8eff9;border-radius:12px;margin-bottom:14px;overflow:hidden}
  .qz-section:last-child{margin-bottom:0}
  .qz-sec-head{display:flex;align-items:center;gap:9px;padding:12px 14px;background:#f5f9ff;border-bottom:1px solid #e8eff9}
  .qz-sec-icon{font-size:18px;line-height:1}
  .qz-sec-title{font-size:14.5px;font-weight:800;color:#1e3a8a}
  .qz-sec-sub{font-size:11.5px;font-weight:700;color:#64748b;background:#eef2f9;border-radius:999px;padding:2px 9px;margin-left:auto;white-space:nowrap}
  .qz-block{padding:14px}
  .qz-block + .qz-block{border-top:1px dashed #e8eff9}
  .qz-block-title{font-size:14px;font-weight:800;color:#1e293b;margin-bottom:6px}
  .qz-block-intro{font-size:12.5px;color:#64748b;line-height:1.55;margin-bottom:10px}
  .qz-level{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;color:#2f6bff;background:#eef4ff;border:1px solid #d5e2fb;border-radius:999px;padding:3px 11px}
  /* 照片下拉匹配 */
  .qz-photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .qz-photo{border:1px solid #e3ecf9;border-radius:11px;padding:10px;background:#fbfcff;display:flex;flex-direction:column;gap:8px}
  .qz-photo img{width:100%;height:110px;object-fit:cover;border-radius:8px;border:1px solid #eef2f9;background:#fff}
  .qz-photo-cap{font-size:12px;color:#33415c;font-weight:600;line-height:1.4}
  /* 下拉 */
  .qz-sel{width:100%;border:1.5px solid #d5e0f0;border-radius:8px;padding:7px 9px;font-size:13px;color:#1e293b;background:#fff;font-weight:600;cursor:pointer;transition:border-color .12s,background .12s}
  .qz-sel:focus{outline:none;border-color:#2f6bff}
  .qz-sel.is-correct{border-color:#22a06b;background:#e6f6ec;color:#14683f}
  .qz-sel.is-wrong{border-color:#e11d48;background:#fff1f2;color:#be123c}
  /* 单选题 */
  .qz-mc{margin-bottom:12px}
  .qz-mc:last-child{margin-bottom:0}
  .qz-mc-text{font-size:13.5px;color:#1e293b;font-weight:600;line-height:1.5;margin-bottom:8px}
  .qz-mark{color:#e11d48;font-weight:800;text-decoration:underline}
  .qz-hint{font-size:12px;color:#b45309;background:#fff7e6;border:1px solid #fde68a;border-radius:8px;padding:7px 10px;line-height:1.45;margin-bottom:9px}
  .qz-options{display:flex;flex-direction:column;gap:6px}
  .qz-opt{display:flex;align-items:center;gap:9px;cursor:pointer;border:1.5px solid #e3ecf9;border-radius:9px;padding:8px 11px;transition:border-color .12s,background .12s}
  .qz-opt:hover{border-color:#bcd0f2;background:#f5f9ff}
  .qz-opt input{accent-color:#2f6bff;margin:0}
  .qz-opt__label{font-size:13px;color:#33415c;font-weight:600;line-height:1.4}
  .qz-opt.is-correct{border-color:#22a06b;background:#e6f6ec}
  .qz-opt.is-correct .qz-opt__label{color:#14683f}
  .qz-opt.is-wrong{border-color:#e11d48;background:#fff1f2}
  .qz-opt.is-wrong .qz-opt__label{color:#be123c}
  .qz-fb{font-size:12.5px;font-weight:700;margin-top:6px}
  .qz-fb.is-ok{color:#14683f}
  .qz-fb.is-bad{color:#be123c}
  /* 选词填空 */
  .qz-wordbank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .qz-word{font-size:12px;font-weight:700;color:#1e3a8a;background:#eef4ff;border:1px solid #d5e2fb;border-radius:999px;padding:3px 10px}
  .qz-fill-item{margin-bottom:12px;line-height:2}
  .qz-fill-item:last-child{margin-bottom:0}
  .qz-fill-label{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#2f6bff;color:#fff;font-size:11px;font-weight:800;margin-right:6px;vertical-align:middle}
  .qz-fill-text{font-size:13.5px;color:#1e293b;font-weight:600}
  .qz-fill-item .qz-sel{display:inline-block;width:auto;min-width:112px;padding:4px 8px;font-size:12.5px;margin:0 2px;vertical-align:middle}
  /* 判断 T/F */
  .qz-tf-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5fb}
  .qz-tf-item:last-child{border-bottom:0}
  .qz-tf-q{flex:1;font-size:13px;color:#1e293b;font-weight:600;line-height:1.45}
  .qz-tf-btns{display:flex;gap:6px;flex:0 0 auto}
  .qz-tf-btn{width:42px;height:34px;border-radius:8px;border:1.5px solid #d5e0f0;background:#fff;color:#33415c;font-weight:800;font-size:14px;cursor:pointer;transition:all .12s}
  .qz-tf-btn:hover{border-color:#bcd0f2}
  .qz-tf-btn.is-on{border-color:#2f6bff;background:#2f6bff;color:#fff}
  .qz-tf-btn.is-correct{border-color:#22a06b;background:#e6f6ec;color:#14683f}
  .qz-tf-btn.is-wrong{border-color:#e11d48;background:#fff1f2;color:#be123c}
  .qz-tf-btn:disabled{cursor:default}
  /* 粒子图选择题 */
  .qz-particle-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .qz-particle-opt{position:relative;border:1.5px solid #e3ecf9;border-radius:11px;padding:10px;cursor:pointer;transition:border-color .12s,background .12s;background:#fff}
  .qz-particle-opt:hover{border-color:#bcd0f2;background:#f5f9ff}
  .qz-particle-opt input{position:absolute;left:10px;top:10px;margin:0;accent-color:#2f6bff}
  .qz-particle-opt .qz-opt-label{position:absolute;left:32px;top:8px;font-size:12px;font-weight:800;color:#33415c}
  .qz-particle-pair{display:flex;align-items:center;gap:8px;margin-top:22px;justify-content:center}
  .qz-pbox{position:relative;width:74px;height:74px;border:1px solid #dbe6f5;border-radius:8px;background:#fbfdff;flex:0 0 auto}
  .qz-pdot{position:absolute;width:9px;height:9px;border-radius:50%;background:#2f6bff;transform:translate(-50%,-50%)}
  .qz-arrow{font-size:20px;color:#94a3b8;font-weight:800}
  .qz-particle-opt.is-correct{border-color:#22a06b;background:#e6f6ec}
  .qz-particle-opt.is-wrong{border-color:#e11d48;background:#fff1f2}
  /* 状态变化填图 */
  .qz-diagram-wrap{text-align:center}
  .qz-diagram{width:100%;max-width:460px;height:auto}
  .qz-diagram-labels{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .qz-diag-label{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#33415c}
  .qz-diag-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#2f6bff;color:#fff;font-size:11px;font-weight:800;flex:0 0 auto}
  .qz-diag-label .qz-sel{flex:1;max-width:220px}
  /* 状态变化填表 */
  .qz-table-wrap{overflow-x:auto}
  .qz-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .qz-table th,.qz-table td{border:1px solid #dbe6f5;padding:8px 7px;text-align:left;vertical-align:middle}
  .qz-table th{background:#f0f6ff;color:#1e3a8a;font-weight:800;font-size:11.5px}
  .qz-table td{color:#33415c;font-weight:600;line-height:1.5}
  .qz-table .qz-sel{width:100%;min-width:96px;padding:5px 6px;font-size:12px}
  .qz-table td .qz-sel{display:inline-block;width:auto;min-width:96px;margin:1px 2px;vertical-align:middle}
  /* 提交与结果 */
  .qz-actions{margin-top:14px}
  .qz-submit{border:1px solid #22a06b;background:#22a06b;color:#fff;font-weight:800;font-size:15px;border-radius:10px;padding:12px 24px;cursor:pointer;width:100%}
  .qz-submit:hover{background:#1a865a;border-color:#1a865a}

  .toast{

  /* ---------- 响应式 ---------- */

    .text-body{padding:12px 13px;max-height:440px}

  @media (max-width:420px){

  html{overflow-x:clip}

<body>

<header class="topbar">
  <div class="topbar__inner">
    <button class="hamburger" id="hamburger" aria-label="打开科目菜单" aria-expanded="false" aria-controls="sidebar">☰</button>

      <span class="grade-box__label">年级</span>
      <div class="grade-switch" id="gradeSwitch" role="tablist" aria-label="年级切换"></div>

<div class="layout">

</div>

<div class="backdrop" id="backdrop" hidden></div>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox__close" type="button" aria-label="Close">×</button>
  <button class="lightbox__nav lightbox__prev" type="button" aria-label="Previous">‹</button>
  <img alt="Enlarged textbook page">
  <button class="lightbox__nav lightbox__next" type="button" aria-label="Next">›</button>
  <div class="lightbox__caption"></div>
  <div class="lightbox__count"></div>
</div>

<script>
/* =========================================================================

  chineseByGrade: {

          review:
            "请扮演香港中一中文科阅卷老师。题目是：结合“鸡肋事件”及之前的数次犯忌，分析曹操杀杨修的根本原因。我的答案是：[请在此处粘贴你的答案]。请严格按以下标准批改：①给分（4分制）：观点明确1分，结合课文事件印证2分，逻辑分析1分。②点评：指出亮点，挑出漏掉的踩分点。③引导：不要直接给答案，用提问引导我补充。请用繁体字回复。",

            { t: `USB versions (by data transfer rate): USB 1.0 (White) Slow; USB 2.0 (Black) Normal; USB 3.0 (Blue) Fast.` },
            { t: `USB connector types: Type-A (standard USB-A plug); Micro-B (micro USB plug); Type-C (USB-C plug).` },

            { t: `5.3 Network Storage`, h: 2 },

            { t: `Network-attached storage (NAS)`, h: 3 },
            { t: `A dedicated file server or storage device.` },
            { t: `Enables multiple users on the same local area network (LAN) to read and write data at the same time.` },

            { t: `Cloud drive`, h: 3 },
            { t: `Users with an internet connection can access and edit data anytime, anywhere.` },
            { t: `Cloud storage providers may charge subscription fees for extra storage space.` },
            { t: `Common examples: Google Drive, Microsoft OneDrive.` },

            { t: `Activity 5.2 — Fire at a Korean data centre`, h: 2 },
            { t: `A fire at a South Korean data centre caused 647 government systems to crash, and data was lost because it had not been backed up externally.` },
            { t: `Discussion: Are cloud services completely reliable? What are the risks of using cloud services?` },

            { t: `Advantages of cloud storage`, h: 3 },
            { t: `Access data online anytime, anywhere, with different devices.` },
            { t: `Easily change storage plans according to needs.` },
            { t: `No need to purchase hardware, which lowers initial setup costs.` },
            { t: `Providers typically use data redundancy to prevent file loss in case of hardware failures.` },

            { t: `Disadvantages of cloud storage`, h: 3 },
            { t: `Without an internet connection, users cannot access their cloud storage.` },
            { t: `Poor management by the provider may lead to data leaks.` },
            { t: `It may involve ongoing subscription fees.` },
            { t: `As the server is shared by multiple users, access may be slower when the server is busy.` },

            { t: `5.4 Storage Capacity`, h: 2 },
            { t: `Storage capacity is the maximum amount of data a device can store.` },
            { t: `Bit (bit, b): the most basic unit of data.` },
            { t: `Byte (B): 1 B = 8 bits.` },
            { t: `Kilobyte (KB): 1 KB = 1024 B.` },
            { t: `Megabyte (MB): 1 MB = 1024 KB.` },
            { t: `Gigabyte (GB): 1 GB = 1024 MB.` },
            { t: `Terabyte (TB): 1 TB = 1024 GB.` },
            { t: `Typical storage: a plain text file (1000 characters) 1–3 KB; a 4-minute MP3 4–10 MB; a 1-hour MP4 video 500 MB–3 GB.` },

            { t: `5.5 Data Transfer Rate`, h: 2 },
            { t: `Data transfer rate is the amount of data transferred per second.` },
            { t: `Comparison (fastest → slowest): SSD (~500–14,000 MB/s) > Hard disk (~100–250 MB/s) > SD card (~10–100 MB/s).` },

            { t: `Activity 5.3 — Computer components product catalogue`, h: 2 },
            { t: `Task: Paul (budget $5,000, mainly word processing) and Tom (budget $6,000, mainly graphic design & video editing) plan to assemble computers. Recommend components and make shopping lists for them.` },
            { t: `CPU: 1) 4 cores 2.4 GHz $1,800; 2) 2 cores 2.4 GHz $1,500; 3) 4 cores 3.5 GHz $1,700; 4) 6 cores 3.5 GHz $2,100.` },
            { t: `RAM: 1) 8 GB 12.8 GB/s $350; 2) 8 GB 20.1 GB/s $400; 3) 16 GB 19.2 GB/s $600; 4) 16 GB 25.4 GB/s $1,200.` },
            { t: `Storage: 1) 2 TB hard disk $400; 2) 4 TB hard disk $900; 3) 512 GB SSD $700; 4) 1 TB SSD $1,200.` },
            { t: `Motherboard: 1) 4× USB 2.0, VGA $500; 2) 2× USB 2.0 + 2× USB 3.0, VGA, HDMI $600; 3) 4× USB 3.0, HDMI, Bluetooth $700; 4) 6× USB 3.0, HDMI, Wi-Fi $800.` },
            { t: `Monitor: 1) 23-inch 1920×1080 VGA $800; 2) 27-inch 1920×1080 VGA $1,200; 3) 23-inch 2560×1440 HDMI $1,400; 4) 27-inch 2560×1440 HDMI $1,800.` },

            { t: `Summary`, h: 2 },
            { t: `Data flow: Input device → System unit (CPU ↔ Main memory ↔ Secondary storage) → Output device.` },
            { t: `Memory/storage tiers (higher tier = faster, smaller capacity, higher cost per unit): Registers → RAM (main memory) → SSD (secondary) → Hard disk (secondary).` }
          ]
        },

          id: "ch6",
          title: "Chapter 6",
          expand: "📖 Expand Chapter 6 Notes",
          collapse: "📖 Collapse Chapter 6 Notes",
          notes: [
            { t: `Part 1 · Knowledge Notes`, h: 1 },

            { t: `Learning Objectives`, h: 2 },
            { t: `Distinguish between software and hardware.` },
            { t: `Understand the functions of system software and application software.` },
            { t: `List some examples of system software and application software.` },

            { t: `Introduction`, h: 2 },
            { t: `Apart from hardware, a computer also needs software to run properly. Software is the intangible (non-physical) part of a computer system, made up of data and instructions that help the computer perform tasks.` },
            { t: `There are two main types of software: system software and application software.` },

            { t: `Activity 6.1 — What software do you use most often?`, h: 2 },
            { t: `Share with your classmates: which software do you use most often, and what do you use it for?` },

            { t: `6.1 System Software`, h: 2 },
            { t: `System software coordinates the operation of computer hardware and application software. There are three types of system software: operating system, utility program and driver program.` },

            { t: `Operating system`, h: 3 },
            { t: `An operating system (OS) controls the operation of the computer's hardware and software, and manages computer resources to ensure that all application software runs smoothly.` },
            { t: `Main functions of an operating system:`, h: 3 },
            { t: `Process management · Memory management · Peripheral device management · File system management · Storage management · User account management · User interface · Multitasking.` },

            { t: `Types of operating systems`, h: 3 },
            { t: `Desktop operating system — designed for desktop and laptop computers; compatible with more hardware and software; usually designed for a single user at a time. Examples: Microsoft Windows, macOS.` },
            { t: `Mobile operating system — designed for mobile devices such as tablets, smartphones and smartwatches; to extend battery life, hardware is optimised (e.g. closing background apps and turning off the screen automatically); most are single-user. Examples: iOS, iPadOS, Android.` },
            { t: `Network operating system — designed to manage network resources and provide services to multiple users or computers (file sharing, web hosting, database management); most are multi-user. Examples: Linux, UNIX.` },

            { t: `Utility program`, h: 3 },
            { t: `A utility program is software designed to maintain computer systems and improve their efficiency. It is usually included in the operating system; third-party utility programs are also available for users to install.` },
            { t: `File management program — e.g. File Explorer: view, add, copy or delete files in the file system.` },
            { t: `System monitoring software — e.g. Task Manager: monitor processes and display system resource usage.` },
            { t: `Virus scanner — e.g. Avast Antivirus: detect and remove computer viruses.` },
            { t: `File backup software — e.g. macOS Time Machine: create backups of files and system settings, so the system can be restored after data corruption or system failure.` },

            { t: `Driver program`, h: 3 },
            { t: `A driver program controls a peripheral device, such as a mouse, keyboard or speakers connected to the computer. Driver programs are usually designed to work with specific types of devices and operating systems.` },

            { t: `6.2 Application Software`, h: 2 },
            { t: `Application software helps users carry out specific tasks. It can be mainly categorised into productivity, communication, and multimedia development software.` },

            { t: `Productivity software`, h: 3 },
            { t: `Productivity software aims to enhance work productivity; it can be used to generate, analyse or present information.` },
            { t: `Word processor — edit documents and apply text formatting. Examples: Microsoft Word, Google Docs.` },
            { t: `Spreadsheet software — calculate formulas and create charts for data analysis. Examples: Microsoft Excel, Google Sheets.` },
            { t: `Presentation software — create slides for presentations. Examples: Microsoft PowerPoint, Google Slides, Canva.` },
            { t: `Database management system — create and organise databases. Examples: Microsoft Access, MySQL.` },

            { t: `Communication software`, h: 3 },
            { t: `Communication software enables users to exchange information via the internet.` },
            { t: `Web browser — browse the internet and interact with it. Examples: Google Chrome, Mozilla Firefox, Safari, Microsoft Edge.` },
            { t: `Email client — send, receive and manage emails. Examples: Gmail, Microsoft Outlook.` },
            { t: `Instant messaging application — send, receive and manage instant messages. Examples: WhatsApp, LINE, WeChat, Instagram DM.` },
            { t: `Web conferencing software — host real-time meetings to connect multiple participants remotely. Examples: Zoom Cloud Meetings, Microsoft Teams, Google Meet.` },

            { t: `Multimedia development software`, h: 3 },
            { t: `Multimedia development software is used to create or edit multimedia files.` },
            { t: `Image editing software — Paint.NET, Adobe Photoshop, Adobe Illustrator.` },
            { t: `Audio editing software — Audacity, Adobe Audition.` },
            { t: `Video editing software — Adobe Premiere, iMovie, CapCut.` },

            { t: `Other application software`, h: 3 },
            { t: `Application software also offers other everyday functions: personal learning, leisure and entertainment, and financial management.` },
            { t: `Educational software — programming, language learning and online courses. Examples: Scratch, MATLAB, Google Classroom.` },
            { t: `Entertainment software — video/audio streaming and gaming platforms. Examples: Spotify, Netflix, Steam.` },
            { t: `Financial management software — electronic payment, virtual banking and expense tracking. Examples: Octopus App, PayMe.` },

            { t: `Activity 6.2 — Which software would you recommend?`, h: 2 },
            { t: `1. "I would like to set up an online tutoring service so that students can study from home."` },
            { t: `2. "I want to know if my computer has a virus."` },
            { t: `3. "I want to edit my photos to make them look better."` },
            { t: `4. "I want to calculate the average score of my maths test and then create a chart."` },

            { t: `Summary`, h: 2 },
            { t: `Software → System software (Operating system · Utility program · Driver program) + Application software (Productivity software · Communication software · Multimedia development software).` },

            { t: `Relationship between hardware, system software, application software and users`, h: 2 },
            { t: `System software controls the operation of hardware, manages system resources, and provides a platform for application software. Application software runs on this platform, enabling users to perform specific tasks.` },
            { t: `Example: Ken (user) uses Excel (application software). Excel runs on the Windows operating system (system software). A driver program (system software) controls the graphics card (hardware) connected to the monitor.` },
            { t: `Layered structure (from top to bottom): User → Application software → System software → Hardware.` }
          ]
        }
      ]
    }
  },

/* 复制到剪贴板（带降级方案） */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* 继续走降级 */ }

  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:-1000px;left:-1000px;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

let toastTimer = null;
function toast(msg) {
  const node = $("#toast");
  node.textContent = msg;
  node.classList.add("is-show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.classList.remove("is-show"), 1900);
}

function bindCopy(btn, text, doneLabel = "已复制 ✓") {
  const original = btn.innerHTML;
  btn.addEventListener("click", async () => {
    const ok = await copyText(text);
    if (ok) {
      toast("指令已复制，去豆包粘贴发送即可");
      btn.classList.add("is-done");
      btn.innerHTML = doneLabel;
      setTimeout(() => {
        btn.classList.remove("is-done");
        btn.innerHTML = original;
      }, 2000);
    } else {
      toast("复制失败，请长按/手动选择文本复制");
    }
  });
}

function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

let ICT_TERM_RE = null;
function highlightTerms(text) {
  if (!ICT_TERM_RE) {
    const joined = ICT_TERMS
      .map(escapeRegExp)
      .sort((a, b) => b.length - a.length)
      .join("|");
    ICT_TERM_RE = new RegExp("\\b(" + joined + ")\\b", "gi");
  }
  return text.replace(ICT_TERM_RE, '<mark class="term">$1</mark>');
}

/* ICT 笔记条目（支持对象 { t, h }：h=1 大标题 / 2 小节 / 3 子标题） */

  if (typeof item === "string") {
    return `<p class="text-para">${highlightTerms(escapeHTML(item))}</p>`;

  const t = (item.t || "").trim();
  const html = highlightTerms(escapeHTML(t));
  if (item.h === 1) return `<div class="text-h">${html}</div>`;
  if (item.h === 2) return `<div class="text-sub">${html}</div>`;
  if (item.h === 3) return `<div class="text-sub3">${html}</div>`;
  return `<p class="text-para">${html}</p>`;
}

        </div>

    return `<div class="qz-block">
      ${block.title ? `<div class="qz-block-title">${esc(block.title)}</div>` : ""}
      ${block.intro ? `<div class="qz-block-intro">${esc(block.intro)}</div>` : ""}
      ${items}
    </div>`;
  }
  if (block.kind === "particle") {
    const options = (block.options || []).map((o, oi) => `
      <label class="qz-particle-opt">
        <input type="radio" name="qz-p-${secIdx}-${blockIdx}" value="${oi}">
        <span class="qz-opt-label">${String.fromCharCode(65 + oi)}</span>
        <div class="qz-particle-pair">
          <div class="qz-pbox">${qzParticles(o.from)}</div>
          <span class="qz-arrow">→</span>
          <div class="qz-pbox">${qzParticles(o.to)}</div>
        </div>
      </label>`).join("");
    return `<div class="qz-block">
      ${block.title ? `<div class="qz-block-title">${esc(block.title)}</div>` : ""}
      <div class="qz-mc" data-answer="${block.answer}">
        <div class="qz-mc-text">${esc(block.stem)}</div>
        <div class="qz-particle-grid">${options}</div>
        <div class="qz-fb" hidden></div>
      </div>
    </div>`;
  }
  if (block.kind === "diagram") {
    const opts = block.options || ["melting", "freezing", "boiling", "condensation", "evaporation"];
    const labels = (block.answers || []).map((a, i) => `
      <div class="qz-diag-label">
        <span class="qz-diag-num">${i + 1}</span>
        ${qzSelect(a, opts, "Choose a process")}
      </div>`).join("");
    return `<div class="qz-block">
      ${block.title ? `<div class="qz-block-title">${esc(block.title)}</div>` : ""}
      ${block.intro ? `<div class="qz-block-intro">${esc(block.intro)}</div>` : ""}
      <div class="qz-diagram-wrap">${qzDiagramSvg()}</div>
      <div class="qz-diagram-labels">${labels}</div>
    </div>`;
  }
  if (block.kind === "statetable") {
    const rows = (block.rows || []).map((row) => {
      const cells = row.cells.map((c) => {
        if (typeof c === "string") return `<td>${esc(c)}</td>`;
        if (c.parts) {
          const inner = c.parts.map((p) => {
            if (typeof p === "string") return `<span>${esc(p)}</span>`;
            if (p.blank) return qzSelect(p.blank, p.opts, "—");
            return `<span>${esc(p.text)}</span>`;
          }).join("");
          return `<td>${inner}</td>`;
        }
        if (c.blank) return `<td>${qzSelect(c.blank, c.opts, "—")}</td>`;
        return `<td>${esc(c.text || "")}</td>`;
      }).join("");
      return `<tr>${cells}</tr>`;
    }).join("");
    return `<div class="qz-block">
      ${block.title ? `<div class="qz-block-title">${esc(block.title)}</div>` : ""}
      ${block.intro ? `<div class="qz-block-intro">${esc(block.intro)}</div>` : ""}
      <div class="qz-table-wrap">
        <table class="qz-table">
          <thead><tr>${(block.cols || []).map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }
  return "";
}
function renderQuizSet(qz) {
  const esc = escapeHTML;
  const sections = (qz.sections || []).map((sec, si) => {
    const blocks = (sec.blocks || []).map((b, bi) => renderQuizBlock(b, si, bi)).join("");
    return `
      <div class="qz-section">
        <div class="qz-sec-head">
          <span class="qz-sec-icon">${esc(sec.icon || "📋")}</span>
          <span class="qz-sec-title">${esc(sec.title || "")}</span>
          ${sec.sub ? `<span class="qz-sec-sub">${esc(sec.sub)}</span>` : ""}
        </div>
        ${blocks}
      </div>`;
  }).join("");
  return `
    <div class="qz-set" data-quizset>
      <div class="qz-title">${esc(qz.title || "Chapter Quiz")}</div>
      <div class="qz-intro">${esc(qz.intro || "")}</div>
      ${sections}
      <div class="qz-actions">
        <button class="qz-submit" type="button">✍️ Submit &amp; mark</button>
      </div>
      <div class="qz-result" hidden></div>
    </div>`;
}

/* Science 笔记条目（支持 { t, h, pg, kp, figrow, fig, slider, match, acc, gallery, chart }） */
function renderScienceNote(item) {
  if (typeof item === "string") {
    return `<p class="text-para">${highlightScienceTerms(escapeHTML(item))}</p>`;
  }
  if (item.quizset) {
    return renderQuizSet(item.quizset);
  }
  if (item.kp) {
    return `<div class="kp"><b>Key point</b><br>${highlightScienceTerms(escapeHTML(item.kp))}${sciPg(item.pg)}</div>`;
  }
  if (item.figrow) {
    const figs = (item.figrow || []).map((f) => `
      <figure class="fig" data-lightbox="${escapeHTML(f.src)}" data-cap="${escapeHTML(f.caption)}">
        <img src="${escapeHTML(f.src)}" alt="${escapeHTML(f.caption)}" loading="lazy">
        <figcaption><span>${escapeHTML(f.caption)}</span>${sciPg(f.pg)}</figcaption>
      </figure>`).join("");
    return `<div class="fig-grid">${figs}</div>`;
  }
  if (item.fig) {
    const f = item.fig;
    return `
      <figure class="fig-inline" data-lightbox="${escapeHTML(f.src)}" data-cap="${escapeHTML(f.caption)}">
        <img src="${escapeHTML(f.src)}" alt="${escapeHTML(f.caption)}" loading="lazy">
        <figcaption><span>${escapeHTML(f.caption)}</span>${sciPg(f.pg)}</figcaption>
      </figure>`;
  }
  if (item.slider) {
    return `
      <div class="temp-slider" data-temp-min="${escapeHTML(String(item.slider.min ?? -30))}"
           data-temp-max="${escapeHTML(String(item.slider.max ?? 130))}"
           data-temp-init="${escapeHTML(String(item.slider.init ?? 20))}">
        <div class="temp-head">
          <div class="temp-state">
            <div class="temp-state-icon" id="temp-icon">💧</div>
            <div>
              <div class="temp-state-name" id="temp-name">Water</div>
              <div class="temp-state-sub" id="temp-sub">liquid state</div>
            </div>
          </div>
          <div class="temp-val" id="temp-val">20 °C</div>
          <div class="temp-energy is-idle" id="temp-energy">Energy: —</div>
        </div>
        <div class="temp-particles" id="temp-particles"></div>
        <input type="range" id="temp-range" min="${escapeHTML(String(item.slider.min ?? -30))}"
               max="${escapeHTML(String(item.slider.max ?? 130))}"
               value="${escapeHTML(String(item.slider.init ?? 20))}" step="1"
               aria-label="Water temperature">
        <div class="temp-scale">
          <span>−30 °C</span><span>0 °C</span><span>100 °C</span><span>130 °C</span>
        </div>
        <p class="temp-hint">Drag the slider to change the temperature and watch how the state of water and the energy change.</p>
      </div>`;
  }
  if (item.match) {
    const m = item.match;
    const pairs = m.pairs || [];
    const terms = pairs.map((p, i) =>
      `<div class="match-term" draggable="true" data-match-term="${i}" data-term="${escapeHTML(p.term)}">${escapeHTML(p.term)}</div>`
    ).join("");
    const slots = pairs.map((p, i) =>
      `<div class="match-slot" data-match-slot="${i}" data-slot="${escapeHTML(p.desc)}"><span class="match-slot__desc">${escapeHTML(p.desc)}</span></div>`
    ).join("");
    return `
      <div class="match-game" data-match>
        <div class="match-head">
          <div class="match-title">${escapeHTML(m.title || "Match the terms")}</div>
          <div class="match-count">Matched <b>0</b> / ${pairs.length}</div>
          <button class="match-reset" type="button">↺ Reset</button>
        </div>
        <div class="match-board">
          <div class="match-col">
            <div class="match-col__label">Processes</div>
            ${terms}
          </div>
          <div class="match-col">
            <div class="match-col__label">Change of state</div>
            ${slots}
          </div>
        </div>
        <div class="match-done">🎉 Well done! All processes matched correctly.</div>
      </div>`;
  }
  if (item.acc) {
    const a = item.acc;
    const inner = (a.blocks || []).map(renderScienceNote).join("");
    return `
      <div class="acc" data-acc>
        <button class="acc-head" type="button" data-acc-toggle aria-expanded="${a.open ? "true" : "false"}">
          <span class="acc-icon">${escapeHTML(a.icon || "🧩")}</span>
          <span class="acc-title">${escapeHTML(a.title || "")}</span>
          ${a.hint ? `<span class="acc-hint">${escapeHTML(a.hint)}</span>` : ""}
          <span class="acc-caret">▼</span>
        </button>
        <div class="acc-body" ${a.open ? "" : "hidden"}>${inner}</div>
      </div>`;
  }
  if (item.lab) {
    const inner = (item.lab.blocks || []).map(renderScienceNote).join("");
    return `<div class="lab-grid">${inner}</div>`;
  }
  if (item.gallery) {
    const g = item.gallery;
    const items = g.items || [];
    const json = JSON.stringify(items.map((f) => ({ src: f.src, cap: f.caption })));
    return `
      <button class="gallery-btn" type="button" data-gallery="${escapeHTML(json)}">
        📖 ${escapeHTML(g.label || "View textbook pages")}
        <span class="gallery-btn__count">${items.length} pages</span>
      </button>`;
  }
  if (item.chart) {
    const c = item.chart;
    return `
      <div class="chart-block" data-chart>
        <svg class="chart-svg" viewBox="0 0 360 230" role="img" aria-label="${escapeHTML(c.title || "Heating curve of water")}">
          <line x1="40" y1="152" x2="340" y2="152" stroke="#e8f0fa" stroke-dasharray="4 4"/>
          <line x1="40" y1="38" x2="340" y2="38" stroke="#e8f0fa" stroke-dasharray="4 4"/>
          <line x1="40" y1="15" x2="40" y2="175" stroke="#a9b8cc" stroke-width="1.5"/>
          <line x1="40" y1="175" x2="340" y2="175" stroke="#a9b8cc" stroke-width="1.5"/>
          <text x="34" y="179" text-anchor="end" font-size="9" fill="#64748b">−20</text>
          <text x="34" y="156" text-anchor="end" font-size="9" fill="#64748b">0</text>
          <text x="34" y="42" text-anchor="end" font-size="9" fill="#64748b">100</text>
          <text x="34" y="19" text-anchor="end" font-size="9" fill="#64748b">120</text>
          <text x="16" y="95" text-anchor="middle" font-size="9" fill="#64748b" transform="rotate(-90 16 95)">Temperature (°C)</text>
          <text x="40" y="190" text-anchor="middle" font-size="9" fill="#64748b">0</text>
          <text x="340" y="190" text-anchor="middle" font-size="9" fill="#64748b">10</text>
          <text x="190" y="203" text-anchor="middle" font-size="9" fill="#64748b">Time / energy absorbed (min)</text>
          <path class="chart-seg chart-seg--1" d="M40,175 L100,152" stroke="#2f6bff" pathLength="100"/>
          <path class="chart-seg chart-seg--2" d="M100,152 L160,152" stroke="#22a06b" pathLength="100"/>
          <path class="chart-seg chart-seg--3" d="M160,152 L220,38" stroke="#2f6bff" pathLength="100"/>
          <path class="chart-seg chart-seg--4" d="M220,38 L280,38" stroke="#f59e0b" pathLength="100"/>
          <path class="chart-seg chart-seg--5" d="M280,38 L340,15" stroke="#2f6bff" pathLength="100"/>
          <circle cx="40" cy="175" r="2.6" fill="#2f6bff"/>
          <circle cx="100" cy="152" r="2.6" fill="#22a06b"/>
          <circle cx="160" cy="152" r="2.6" fill="#22a06b"/>
          <circle cx="220" cy="38" r="2.6" fill="#f59e0b"/>
          <circle cx="280" cy="38" r="2.6" fill="#f59e0b"/>
          <circle cx="340" cy="15" r="2.6" fill="#2f6bff"/>
          <g class="chart-note chart-note--melt">
            <text x="130" y="168" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14683f">melting</text>
            <text x="130" y="144" text-anchor="middle" font-size="8.5" fill="#22a06b">0 °C · solid → liquid</text>
          </g>
          <g class="chart-note chart-note--boil">
            <text x="250" y="54" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">boiling</text>
            <text x="250" y="30" text-anchor="middle" font-size="8.5" fill="#f59e0b">100 °C · liquid → gas</text>
          </g>
        </svg>
        <div class="chart-cap">${escapeHTML(c.caption || "Heating curve of water: temperature stays the same during melting and boiling.")}</div>
        <div class="chart-legend">
          <span class="leg-heat"><i></i>heating (temp rises)</span>
          <span class="leg-melt"><i></i>melting (0 °C)</span>
          <span class="leg-boil"><i></i>boiling (100 °C)</span>
        </div>
        <button class="chart-replay" type="button">↺ Replay animation</button>
      </div>`;
  }
  if (item.summaryTable) {
    const st = item.summaryTable;
    const rows = (st.rows || []).map((r) => `
      <tr>
        <td class="st-process">${escapeHTML(r.process)}</td>
        <td>${escapeHTML(r.change)}</td>
        <td>${escapeHTML(r.temp)}</td>
        <td class="st-energy">
          <select class="st-select" data-answer="${escapeHTML(r.answer)}" aria-label="Energy for ${escapeHTML(r.process)}">
            <option value="">Choose…</option>
            <option value="absorbed">Absorbed</option>
            <option value="released">Released</option>
          </select>
        </td>
      </tr>`).join("");
    return `
      <div class="summary-table" data-summary>
        <div class="st-title">${escapeHTML(st.title || "Complete the summary table")}</div>
        <div class="st-wrap">
          <table class="st-table">
            <thead>
              <tr>
                <th>Process</th>
                <th>Change in states</th>
                <th>Temperature</th>
                <th>Energy absorbed or released?</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="st-actions">
          <button class="st-check" type="button">✓ Check answers</button>
          <span class="st-result" hidden></span>
        </div>
      </div>`;
  }
  if (item.quiz) {
    const qz = item.quiz;
    const graph = qz.graph ? `
      <div class="qq-graph-block">
        <svg class="qq-graph" viewBox="0 0 320 200" role="img" aria-label="Heating curve of water">
          <line x1="45" y1="20" x2="45" y2="165" stroke="#a9b8cc" stroke-width="1.5"/>
          <line x1="45" y1="165" x2="300" y2="165" stroke="#a9b8cc" stroke-width="1.5"/>
          <path d="M45,150 L150,60 L270,60" fill="none" stroke="#2f6bff" stroke-width="3" stroke-linejoin="round"/>
          <line x1="45" y1="60" x2="270" y2="60" stroke="#f59e0b" stroke-dasharray="5 4" stroke-width="1.2"/>
          <text x="36" y="64" text-anchor="end" font-size="11" fill="#b45309" font-weight="700">T</text>
          <circle cx="45" cy="150" r="3" fill="#2f6bff"/>
          <circle cx="150" cy="60" r="3" fill="#2f6bff"/>
          <circle cx="270" cy="60" r="3" fill="#2f6bff"/>

          <text x="172" y="194" text-anchor="middle" font-size="10" fill="#64748b">time (min)</text>
          <text x="16" y="95" text-anchor="middle" font-size="10" fill="#64748b" transform="rotate(-90 16 95)">water temperature (°C)</text>

        <div class="qq-graph-cap">${escapeHTML(qz.graph.caption)}</div>
      </div>` : "";

    const questions = (qz.questions || []).map((q, i) => `
      <div class="qq" data-qq data-answer="${q.answer}">
        <div class="qq-head">
          <span class="qq-num">Q${i + 1}</span>
          ${q.level ? `<span class="qq-level">${escapeHTML(q.level)}</span>` : ""}
        </div>
        <div class="qq-text">${escapeHTML(q.q)}</div>
        <div class="qq-options">
          ${(q.options || []).map((opt, oi) => `
            <label class="qq-opt">
              <input type="radio" name="qq-${i}" value="${oi}">
              <span class="qq-opt__label">${String.fromCharCode(65 + oi)}. ${escapeHTML(opt)}</span>
            </label>`).join("")}
        </div>
        <div class="qq-feedback" hidden></div>
      </div>`).join("");

    const dragPart = qz.drag ? `
      <div class="qq-drag">
        <div class="qq-drag-title">🧩 Drag &amp; drop question</div>
        ${renderScienceNote({ match: { title: qz.drag.title || "Match the terms", pairs: qz.drag.pairs } })}
      </div>` : "";

    return `
      <div class="chapter-quiz" data-quiz>
        <div class="cq-title">${escapeHTML(qz.title || "Chapter quiz")}</div>
        <div class="cq-intro">${escapeHTML(qz.intro || "")}</div>
        ${graph}
        ${questions}
        ${dragPart}
        <div class="cq-actions">
          <button class="cq-submit" type="button">✍️ Submit</button>
        </div>
        <div class="cq-result" hidden></div>
      </div>`;
  }
  const t = (item.t || "").trim();
  const html = highlightScienceTerms(escapeHTML(t));
  if (item.h === 1) return `<div class="text-h">${html}${sciPg(item.pg)}</div>`;
  if (item.h === 2) return `<div class="text-sub">${html}${sciPg(item.pg)}</div>`;
  if (item.h === 3) return `<div class="text-sub3">${html}${sciPg(item.pg)}</div>`;
  return `<p class="text-para">${html}${sciPg(item.pg)}</p>`;
}

/* ---------- Science 标签页（Tabs） ---------- */
function renderScienceTabs(tabs, key) {
  const bar = tabs.map((t, i) => `
    <button class="sci-tab" type="button" data-tab-target="${key}-${t.id}" role="tab" aria-selected="${i === 0 ? "true" : "false"}">
      <span class="sci-tab__icon">${escapeHTML(t.icon || "")}</span>
      <span class="sci-tab__label">${escapeHTML(t.title)}</span>
    </button>`).join("");
  const panels = tabs.map((t, i) => `
    <div class="sci-tabpanel" id="${key}-${t.id}" role="tabpanel" ${i === 0 ? "" : "hidden"}>
      ${(t.blocks || []).map(renderScienceNote).join("")}
    </div>`).join("");
  return `
    <div class="sci-tabs" data-tabs="${key}">
      <div class="sci-tabbar" role="tablist">${bar}</div>
      <div class="sci-tabpanels">${panels}</div>
    </div>`;
}

/* ---------- Science 科页面 ---------- */
function renderScience(sci, name) {
  const chapterCards = (sci.chapters || []).map((ch) => {
    const num = (ch.title || "").match(/\d+/)?.[0] || "2";
    const sections = (ch.sections || []).map((sec) => {
      const key = `${ch.id}-${sec.id}`;
      if (sec.checkpoint) {
        return `
      <div class="sci-section sci-section--checkpoint">
        <a class="sci-checkpoint-card" href="${escapeHTML(sec.link)}" data-keep-share>
          <span class="sci-checkpoint-icon">🌟</span>
          <span class="sci-checkpoint-text">
            <span class="sci-checkpoint-title">${escapeHTML(sec.title)}</span>
            ${sec.desc ? `<span class="sci-checkpoint-desc">${escapeHTML(sec.desc)}</span>` : ""}
          </span>
          <span class="sci-checkpoint-arrow">→</span>
        </a>
      </div>`;
      }
      if (sec.link) {
        return `
      <div class="sci-section">
        <div class="sci-link-row">
          <div class="sci-link-main">
            <span class="sci-sec-num">${escapeHTML(sec.id)}</span>
            <span class="sci-sec-title">${escapeHTML(sec.title)}</span>
            ${sec.pages ? `<span class="pg">${escapeHTML(sec.pages)}</span>` : ""}
          </div>
          <div class="sci-link-actions">
            <a class="sci-link-btn" href="${escapeHTML(sec.link)}" data-keep-share>📖 Notes</a>
            ${sec.quiz ? `<a class="sci-link-btn sci-link-btn--quiz" href="${escapeHTML(sec.quiz)}" data-keep-share>✍️ Quiz</a>` : ""}
          </div>
        </div>
      </div>`;
      }
      const hasTabs = Array.isArray(sec.tabs) && sec.tabs.length > 0;
      const hasContent = Array.isArray(sec.blocks) && sec.blocks.length > 0;
      const body = hasTabs
        ? renderScienceTabs(sec.tabs, key)
        : (hasContent
            ? sec.blocks.map(renderScienceNote).join("")
            : `<p class="chapter-empty">${escapeHTML(sec.title)} notes coming soon.</p>`);
      return `
      <div class="sci-section">
        <button class="sci-sec-head" type="button" data-sci-toggle="${key}" aria-expanded="${sec.expand ? "true" : "false"}">
          <span class="sci-sec-num">${escapeHTML(sec.id)}</span>
          <span class="sci-sec-title">${escapeHTML(sec.title)}</span>
          ${sec.pages ? `<span class="pg">${escapeHTML(sec.pages)}</span>` : ""}
          <span class="sci-sec-caret">▼</span>
        </button>
        <div class="sci-sec-body" id="${key}" ${sec.expand ? "" : "hidden"}>
          ${body}
        </div>
      </div>`;
    }).join("");
    return `
    <div class="chapter-card">
      <div class="chapter-head">
        <div class="chapter-num">${num}</div>
        <h3 class="chapter-title">${escapeHTML(ch.title)}</h3>
      </div>
      <div class="sci-sections">${sections}</div>
    </div>`;
  }).join("");

  return `
  <div class="page-head">
    <div class="crumb">${escapeHTML(state.grade)} <span aria-hidden="true">/</span> <b>${escapeHTML(name)}</b></div>
    <h1 class="page-title">${escapeHTML(sci.title)}</h1>
    <p class="page-desc">Structured revision notes · textbook page references · diagrams</p>
  </div>
  <div class="cards">
    <section class="card card--wide">
      <div class="card__head">
        <div class="card__icon">🔬</div>
        <div class="card__titles">
          <h2 class="card__title">${escapeHTML(sci.title)}</h2>
          <p class="card__sub">Revision notes with textbook page references</p>
        </div>
      </div>
      <div class="card__body">
        <div class="chapters">${chapterCards}</div>
      </div>
    </section>
  </div>`;
}

/* ICT 练习题（支持 { q, options } 与 { divider }） */
function renderQuizQuestion(item) {

/* ---------- ICT 概念全景图（Mermaid mindmap） ---------- */
const ICT_MINDMAP = `mindmap
  root((Computer system))
    Hardware
      System unit
        Motherboard
        Central processing unit (CPU)
          Arithmetic and logic unit (ALU)
          Control unit (CU)
          Registers
        Storage device
          Main memory
            RAM
            ROM
          Secondary storage
            SSD
            USB flash drive
            Memory card
        Power supply unit
      Input device
        Keyboard
        Pointing device
          Mouse
          Touch screen
        Webcam
      Output device
        Monitor
        Printer
        Speakers
    Software
      System software
        Operating system
        Driver program
        Utility program
      Application software
        Productivity software
        Communication software
        Multimedia development software
`;

// 思维导图配色：根节点用中性深色；第一层的两个分支（Hardware / Software）各用一套色系，
// 分支内按层级由深到浅（第一层最深，逐级变浅）。
const ROOT_COLOR = "#334155"; // 根节点 · 深灰蓝

// 每个分支一套色系，下标 0 = 第一层（最深），逐级变浅
const BRANCH_COLORS = [
  // 分支 0 · Hardware · 橙色系（深 → 浅）
  ["#7c2d12", "#9a3412", "#c2410c", "#ea580c", "#fb923c"],
  // 分支 1 · Software · 蓝色系（深 → 浅）
  ["#1e3a8a", "#1d4ed8", "#2563eb", "#3b82f6", "#60a5fa"]
];

// 从 mindmap 源码解析每个节点的层级与所属分支，返回与 SVG 节点顺序一致的数组
function parseMindmapStructure(mmd) {
  const lines = mmd.split("\n");
  const rootLine = lines.find((l) => l.trim().startsWith("root("));
  const rootIndent = rootLine ? (rootLine.match(/^\s*/) || [""])[0].length : 0;
  const nodes = [];
  let branch = 0;
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    if (trimmed === "mindmap" || trimmed.startsWith("classDef") || trimmed.startsWith("%%")) continue;
    const indent = (line.match(/^\s*/) || [""])[0].length;
    const depth = trimmed.startsWith("root(") ? 0 : Math.max(1, Math.round((indent - rootIndent) / 2));
    if (depth === 0) {
      branch = -1;
    } else if (depth === 1) {
      branch = /software/i.test(trimmed) ? 1 : 0; // Software → 蓝，其余第一层分支（Hardware）→ 橙
    }
    nodes.push({ depth, branch });
  }
  return nodes;
}

// 计算相对亮度，用于决定节点文字用白色还是深色
function hexLuminance(hex) {
  const h = hex.replace("#", "");
  const c = (i) => {
    const v = parseInt(h.slice(i, i + 2), 16) / 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  };
  return 0.2126 * c(0) + 0.7152 * c(2) + 0.0722 * c(4);
}

// 渲染完成后，按「分支 + 层级」给节点背景上色，文字自动取白/深色保证对比度
function colorizeMindmap(wrap) {
  const structure = parseMindmapStructure(ICT_MINDMAP);
  const nodes = wrap.querySelectorAll("g.mindmap-node");
  nodes.forEach((g, i) => {
    const info = structure[i] || { depth: 0, branch: 0 };
    let color = ROOT_COLOR;
    if (info.depth > 0 && info.branch >= 0) {
      const ramp = BRANCH_COLORS[info.branch] || BRANCH_COLORS[0];
      color = ramp[info.depth - 1] || ramp[ramp.length - 1];
    }
    const bgGroup = g.querySelector("g");
    if (bgGroup) {
      bgGroup.querySelectorAll("circle, rect, path, polygon").forEach((s) => {
        s.style.fill = color;
        s.style.stroke = "none";
      });
    }
    const textColor = hexLuminance(color) > 0.35 ? "#1f2937" : "#ffffff";
    g.querySelectorAll("text").forEach((t) => { t.style.fill = textColor; });
  });
}

let mermaidPromise = null;
function ensureMermaid() {
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "vendor/mermaid.min.js";
    s.onload = () => {
      try {
        window.mermaid.initialize({ startOnLoad: false, theme: "base", securityLevel: "loose" });
        resolve(window.mermaid);
      } catch (e) {
        mermaidPromise = null;
        reject(e);
      }
    };
    s.onerror = () => { mermaidPromise = null; reject(new Error("mermaid load failed")); };
    document.head.appendChild(s);
  });
  return mermaidPromise;
}

function toggleMindmap(btn) {
  const wrap = document.getElementById(btn.getAttribute("data-mindmap"));
  if (!wrap) return;
  const open = wrap.hidden;
  wrap.hidden = !open;
  btn.setAttribute("aria-expanded", String(open));
  btn.innerHTML = open ? "🗺️ Hide Concept Map" : "🗺️ Show Concept Map";

  if (open && !wrap.dataset.rendered) {
    wrap.innerHTML = `<div class="mindmap-loading">Loading diagram…</div>`;
    ensureMermaid()
      .then((mermaid) => {
        const id = "ict-mindmap-" + Date.now();
        return mermaid.render(id, ICT_MINDMAP);
      })
      .then(({ svg }) => {
        wrap.innerHTML = svg;
        wrap.dataset.rendered = "1";
        colorizeMindmap(wrap);
      })
      .catch(() => {
        wrap.innerHTML = `<div class="mindmap-error">Failed to render the mindmap.</div>`;
      });
  }
}
