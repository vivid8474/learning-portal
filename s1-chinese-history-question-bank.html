<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>中國歷史（中一）· 題庫</title>
<style>
:root{--ink:#1f2a3d;--mut:#66748a;--line:#e2e9f4;--bg:#f5f8fd;--card:#fff;--brand:#2f6fd0;--teal:#12a594;--red:#c0392b;--green:#0a8f5b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",sans-serif;color:var(--ink);background:var(--bg);line-height:1.65}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 90px}
header.hero{background:linear-gradient(135deg,#2f6fd0,#12a594);color:#fff;padding:30px 16px 26px}
header.hero .wrap{padding-bottom:0}
.hero h1{margin:0 0 6px;font-size:25px}
.hero p{margin:3px 0;opacity:.95;font-size:14px}
.hero .meta{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.hero .meta span{background:rgba(255,255,255,.18);padding:4px 11px;border-radius:20px;font-size:12.5px}
.tabs{display:flex;gap:8px;margin:18px 0 6px;border-bottom:2px solid var(--line)}
.tab{cursor:pointer;padding:10px 18px;font-size:15px;font-weight:600;color:var(--mut);border:none;background:none;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:0 2px 10px rgba(30,60,120,.04)}
.panel h3{margin:0 0 12px;font-size:16px}
.notice{background:#fff8e6;border:1px solid #f5d98a;border-radius:12px;padding:13px 16px;margin:16px 0;font-size:13px}
.notice b{color:#a8730a}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.lbl{font-size:13px;color:var(--mut);font-weight:600;min-width:70px}
.chip{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:13px;user-select:none;white-space:nowrap}
.chip:hover{border-color:var(--brand)}
.chip.on{background:#e7efff;border-color:var(--brand);color:var(--brand);font-weight:600}
.chip.chip-act{border-style:dashed;color:var(--mut)}
.chip.chip-act:hover{border-color:var(--brand);color:var(--brand)}
.chip-sep{color:var(--line);user-select:none;padding:0 2px}
#chChips,#lvChips,#bChChips,#bLvChips{display:flex;flex-wrap:wrap;gap:8px;flex-basis:100%}
.chip-group{flex-basis:100%;font-size:12px;font-weight:700;color:var(--brand);margin-top:4px;padding-left:2px;border-left:3px solid var(--brand);padding-left:8px;line-height:1.4}
.chip-group:first-child{margin-top:0}
.btn{cursor:pointer;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:600;color:#fff;background:var(--brand)}
.btn:hover{filter:brightness(1.05)}
.btn.teal{background:var(--teal)} .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.gray{background:#8b98ad}
select,input[type=number]{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;background:#fff;color:var(--ink)}
.stat{font-size:13px;color:var(--mut)}
.badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px}
.lv-easy{background:#e4f7ee;color:var(--green)}.lv-core{background:#e7efff;color:var(--brand)}.lv-hard{background:#ffe6e6;color:var(--red)}
.ty-b{font-size:11px;color:var(--mut);background:#f0f3f9;padding:2px 9px;border-radius:10px}
.kp-b{font-size:11px;color:#7a5cc9;background:#f1ecff;padding:2px 9px;border-radius:10px}
/* Browse mode */
.qlist{display:grid;gap:12px}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.qtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qno{background:var(--brand);color:#fff;font-weight:700;font-size:12px;border-radius:7px;padding:2px 9px}
.qtext{font-weight:600;font-size:14.5px;margin:4px 0 10px}
.qfig{margin:8px 0;text-align:center}
.qfig img{max-width:100%;max-height:210px;border-radius:9px;border:1px solid var(--line)}
.qfig figcaption{font-size:11px;color:var(--mut);margin-top:4px}
.opt{padding:6px 10px;border:1px solid var(--line);border-radius:8px;margin:5px 0;font-size:13.5px;background:#fbfcfe}
.opt.correct{background:#e6f7ee;border-color:#7dd3a8}
.opt.wrong{background:#fdeaea;border-color:#f0a5a5}
.ord{padding:6px 10px;border:1px dashed #cdd8ea;border-radius:8px;margin:5px 0;font-size:13.5px}
.mt{padding:7px 10px;border-radius:8px;font-size:13px;border:1px solid var(--line);background:#fbfcfe;margin:5px 0}
.match2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 9px}
table.cmp th{background:#eef4fd}
details.ans{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
details.ans summary{cursor:pointer;color:var(--brand);font-size:13px;font-weight:600;list-style:none}
details.ans summary::-webkit-details-marker{display:none}
details.ans summary::before{content:"▸ "} details.ans[open] summary::before{content:"▾ "}
.ansbody{margin-top:8px;background:#f8fbff;border-radius:9px;padding:10px 13px;font-size:13px}
.ansbody ul{margin:6px 0;padding-left:20px}
.why{color:#444;margin:6px 0}.pt{color:var(--teal);margin-top:6px}
/* Exam paper */
.paper-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:2px solid var(--brand);padding-bottom:10px;margin-bottom:16px}
.paper-head h2{margin:0;font-size:20px}
.pq{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.pq .stem{font-weight:600;font-size:14.5px;margin:8px 0}
.answer-line{margin:8px 0}
.optpick{cursor:pointer;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin:5px 0;font-size:13.5px;background:#fbfcfe;display:flex;gap:8px;align-items:flex-start}
.optpick:hover{border-color:var(--brand)}
.optpick.sel{border-color:var(--brand);background:#eaf2ff}
.optpick .rd{width:16px;height:16px;border:2px solid #c3ccd9;border-radius:50%;flex:none;margin-top:2px}
.optpick.sel .rd{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 3px #fff}
.optpick.mk-correct{background:#e6f7ee;border-color:#7dd3a8}
.optpick.mk-wrong{background:#fdeaea;border-color:#f0a5a5}
select.matchsel{border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:13px;margin-left:6px;max-width:100%}
.orderbox{display:flex;flex-direction:column;gap:6px}
.orderitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13.5px;background:#fbfcfe}
.orderitem .ov{width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:#eef4fd;color:var(--brand);font-size:12px;font-weight:700;flex:none}
.orderitem .otxt{flex:1}
.mvbtn{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;width:26px;height:26px;font-size:13px;color:var(--brand)}
textarea.ans-ta{width:100%;min-height:84px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;resize:vertical}
.feedback{margin-top:10px;border-radius:9px;padding:9px 12px;font-size:13px}
.fb-ok{background:#e6f7ee;color:#0a6b47}.fb-no{background:#fdeaea;color:#a03030}
.ref{margin-top:8px;background:#f8fbff;border-radius:8px;padding:9px 12px;font-size:12.5px}
.ref ul{margin:5px 0;padding-left:18px}
.scorebar{position:sticky;bottom:0;z-index:6;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 0;margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.score{font-size:16px;font-weight:700;color:var(--brand)}
.empty{text-align:center;color:var(--mut);padding:30px;font-size:14px}
.kpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.kpitem{font-size:12.5px;background:#f7f9fd;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.cov-unit{margin:14px 0;padding:12px 14px;background:#fbfcff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px}
.cov-unit-title{font-size:15px;font-weight:800;color:var(--brand);margin-bottom:6px}
@media(max-width:640px){
 .hero h1{font-size:20px}.match2{grid-template-columns:1fr}.panel{padding:14px}
 .tab{padding:9px 12px;font-size:14px}.paper-head h2{font-size:17px}
}
@media print{
 header.hero,.tabs,.no-print,.scorebar,.filterbar{display:none!important}
 body{background:#fff}.wrap{max-width:none;padding:0}
 .panel,.q,.pq{border:1px solid #bbb;box-shadow:none;break-inside:avoid}
 .feedback,.ref{display:none}
}
</style></head><body>
<header class="hero"><div class="wrap">
 <h1>中國歷史（中一）· 題庫</h1>
 <p>按知識點 × 題型 × 難度編排，涵蓋考評局歷史科各項能力；可生成隨機試卷、網上作答並自動批改</p>
 <div class="meta"><span>📚 77 題</span><span>🎯 19 知識點</span><span>📖 2 單元 · 4 章</span><span>🎲 生成試卷</span><span>✅ 自動批改</span></div>
</div></header>
<div class="wrap">
 <div class="tabs no-print">
   <button class="tab on" data-tab="generate">🎲 生成試卷</button>
   <button class="tab" data-tab="browse">📚 按章節瀏覽</button>
   <button class="tab" data-tab="coverage">🎯 覆蓋一覽</button>
 </div>

 <!-- Random paper generation -->
 <div id="view-generate">
  <div class="panel no-print">
   <h3>試卷設定</h3>
   <div class="row"><span class="lbl">章節：</span><span id="chChips"></span></div>
   <div class="row"><span class="lbl">難度：</span><span id="lvChips"></span></div>
   <div class="row"><span class="lbl">題數：</span>
     <select id="numSel"><option value="10" selected>10 題</option><option value="5">5 題</option><option value="15">15 題</option><option value="20">20 題</option><option value="0">全部</option></select>
     <span class="lbl" style="min-width:auto">難度配比：</span><select id="modeSel"><option value="balanced">均衡（基本／核心／挑戰）</option><option value="random">完全隨機</option><option value="easy">偏基本</option><option value="hard">偏挑戰</option></select>
   </div>
   <div class="row">
     <button class="btn" id="genBtn">🎲 生成試卷</button>
     <button class="btn ghost" id="regenBtn" style="display:none">🔄 另一組</button>
     <button class="btn gray" id="printBtn2" style="display:none">🖨️ 列印</button>
     <span class="stat" id="poolStat"></span>
   </div>
   <div class="notice" style="margin:10px 0 0">作答方法：選擇題點擊選項，配對題使用下拉選單，排序題使用箭頭調整。客觀題提交後自動批改；資料題、簡答題和論述題則顯示參考答案供自我核對。</div>
  </div>
  <div id="paper"></div>
 </div>

 <!-- Browse by chapter -->
 <div id="view-browse" style="display:none">
  <div class="panel no-print">
   <div class="row"><span class="lbl">章節：</span><span id="bChChips"></span></div>
   <div class="row"><span class="lbl">難度：</span><span id="bLvChips"></span></div>
   <div class="row"><span class="stat" id="bStat"></span></div>
  </div>
  <div id="browseList" class="qlist"></div>
 </div>

 <!-- Coverage -->
 <div id="view-coverage" style="display:none">
  <div class="panel"><h3>各章節 × 知識點覆蓋</h3><div id="covChapters"></div></div>
  <div class="panel"><h3>能力維度（依香港考評局歷史科考核目標）</h3><div id="covSkills"></div></div>
 </div>
</div>

的起源", "imgData": "", "obj": true}, {"kp": "a2", "lv": "core", "ty": "match", "q": "將新石器時代文化與其特色配對。", "L": ["仰韶文化", "良渚文化", "紅山文化", "龍山文化"], "R": ["彩陶、半穴式房屋", "玉器、干欄式房屋、種稻", "玉器（如玉豬龍）、祭壇", "精美的黑陶（蛋殼陶）"], "ans": [0, 1, 2, 3], "why": "仰韶以彩陶聞名；良渚在長江下游、種稻、干欄式房屋；紅山在遼河流域、多玉器；龍山以黑陶著稱。", "pt": "四大文化特色配對", "id": "q006", "chId": "c1-origin", "ch": "第一章 · 中華民族與早期國家的起源", "chapterTitle": "中華民族與早期國家的起源", "imgData": "", "obj": true}, {"kp": "a2", "lv": "core", "ty": "compare", "q": "比較仰韶文化的半穴式房屋與良渚文化的干欄式房屋。", "head": ["項目", "半穴式房屋（仰韶）", "干欄式房屋（良渚）"], "rows": [["所在地區", "黃河中游（乾燥）", "長江下游（潮濕）"], ["建築方式", "房屋下半部陷入地下", "以木樁架高，建於沼澤上"], ["主要功能", "保暖禦寒、防風沙", "防潮、防蟲蛇、通風"]], "why": "訓練比較異同的能力，理解文化與地理環境的關係。", "pt": "房屋建築比較", "id": "q007", "chId": "c1-origin", "ch": "第一章 · 中華民族與早期國家的起源", "chapterTitle": "中華民族與早期國家的起源", "imgData": "", "obj": false}, {"kp": "a2", "lv": "hard", "ty": "essay", "q": "「中國新石器時代文化呈現多元一體的特點。」試加以說明。", "rub": ["多元：黃河流域的仰韶、龍山，長江流域的良渚，遼河流域的紅山，各具特色（彩陶、玉器、黑陶、稻作等）。", "一體：各區文化長期互相接觸、交流，逐漸融合，成為中華文明起源的重要部分。", "總結：多元文化在交流中形成共同的文化特質。"], "why": "考查對「多元一體」概念的深层理解與論證。", "pt": "多元一體論述", "id": "q008", "chId": "c1-origin", "ch": "第一章 · 中華民族與早期國家的起源", "chapterTitle": "中華民族與早期國家的起源", "imgData": "", "obj": false}, {"kp": "a3", "lv": "easy", "ty": "mcq", "q": "相傳與炎帝部落合併，並被各部落擁戴為共主的是誰？", "opts": ["堯", "舜", "黃帝", "禹"], "ans": 2, "why": "黃帝在阪泉打敗炎帝，兩部落合併；其後又在逐鹿打敗蚩尤，被各部落擁戴為共主。", "pt": "黃帝部落", "id": "q009", "chId": "c1-origin", "ch": "第一章 · 中華民族與早期國家的起源", "chapterTitle": "中華民族與早期國家的起源", "imgData": "", "obj": true}, {"kp": "a3", "lv": "core", "ty": "order", "q": "將傳疑時代的事件按先後次序排列。", "items": ["黃帝在阪泉打敗炎帝，炎黃合併", "黃帝在逐鹿打敗蚩尤", "後人稱華夏族，視炎黃為始祖", "形成「中國」「中華」概念"], "ans": [0, 1, 2, 3], "why": "先炎黃合併，再敗蚩尤，其後稱華夏族、視炎黃為始祖，進而形成中國與中華概念。", "pt": "華夏形成次序", "id": "q010", "chId": "c1-origin", "ch": "第一章 · 中華民族與早期國家的起源", "chapterTitle": "中華民族與早期國家的起源", "imgData": "", "obj": true}, {"kp": "a3", "lv": "hard", "ty": "short", "q": "為何後人自稱「炎黃子孫」？", "pts": ["黃帝與炎帝被視為華夏民族的始祖。", "炎黃兩部落合併，奠定華夏族的基礎。", "後人用以標示共同的祖先與文化認同。"], "why": "考查華夏民族起源與文化認同。", "pt": "炎黃子孫由來", "id": "q011", "chId": "c1-origin", "ch": "第一章 · 中華民族與早期國家的起源", "chapterTitle": "中華民族與早期國家的起源", "imgData": "", "obj": false}, {"kp": "a4", "lv": "easy", "ty": "mcq", "q": "堯舜時期把共主之位傳給有才德者的制度稱為：", "opts": ["世襲制度", "禪讓制度", "封建制度", "宗法制度"], "ans": 1, "why": "堯傳舜、舜傳禹，傳位不計血緣而選有才德者，史稱「禪讓」。", "pt": "禪讓制度", "id": "q012", "chId": "c1-origin", "ch": "第一章 · 中華民族與早期國家的起源", "chapterTitle": "中華民族與早期國家的起源", "imgData": "", "obj": true}, {"kp": "a4", "lv": "core", "ty": "vs", "q": "比較禪讓制度與王位世襲制度。", "left": {"tone": "a", "ico": "🤝", "title": "禪讓制度", "tagline": "傳賢不傳子", "rows": [["選人標準", "有才德的人"], ["血緣", "不計較血緣"], ["例子", "堯傳舜、舜傳禹"], ["評價", "後世視為理想政治制度"]]}, "right": {"tone": "b", "ico": "👑", "title": "王位世襲", "tagline": "父傳子兄傳弟", "rows": [["選人標準", "按血緣繼承"], ["血緣", "重視血緣"], ["例子", "禹死後啟繼位"], ["評價", "開創首個世襲王朝"]]}, "why": "訓練比較制度異同的能力。", "pt": "禪讓與世襲對比", "id": "q013", "chId": "c1-origin", "ch": "第一章 · 中華民族與早期國家的起源", "chapterTitle": "中華民族與早期國家的起源", "imgData": "", "obj": false}, {"kp": "a4", "lv": "hard", "ty": "essay", "q": "「大禹治水，三過家門而不入」體現了甚麼精神？試說明之。", "rub": ["禹為讓百姓免受水患，辛勤治水多年。", "三次經過家門都不回家，反映公而忘私的精神。", "堅毅不屈、以民為先，值得讚頌。"], "why": "考查從史事提煉價值觀與論述能力。", "pt": "大禹治水精神", "id": "q014", "chId": "c1-origin", "ch": "第一章 · 中華民族與早期國家的起源", "chapterTitle": "中華民族與早期國家的起源", "imgData": "", "obj": false}, {"kp": "a5", "lv": "easy", "ty": "mcq", "q": "中國歷史上第一個世襲王朝是哪一個？", "opts": ["夏", "商", "周", "秦"], "ans": 0, "why": "禹死後兒子啟繼位，開創父傳子、兄傳弟的王位世襲制度，夏朝是中國史上第一個世襲王朝。", "pt": "首個世襲王朝", "id": "q015", "chId": "c1-origin", "ch": "第一章 · 中華民族與早期國家的起源", "chapterTitle": "中華民族與早期國家的起源", "imgData": "", "obj": true}, {"kp": "a5", "lv": "core", "ty": "order", "q": "將夏商周三代及重要事件按先後排列。", "items": ["禹建立夏朝", "商湯伐桀建立商朝", "周武王伐紂建立西周", "犬戎攻陷鎬京，平王東遷（東周）"], "ans": [0, 1, 2, 3], "why": "夏（禹）→ 商（湯伐桀）→ 西周（武王伐紂）→ 東周（平王東遷）。", "pt": "三代興替次序", "id": "q016", "chId": "c1-origin", "ch": "第一章 · 中華民族與早期國家的起源", "chapterTitle": "中華民族與早期國家的起源", "imgData": "", "obj": true}, {"kp": "a5", "lv": "core", "ty": "match", ": "order", "q": "將西周初年的事件按先後排列。", "items": ["武王伐紂建立周朝", "武王第一次封建", "三監之亂爆發", "周公東征平亂", "周公營建東都洛邑、第二次封建"], "ans": [0, 1, 2, 3, 4], "why": "武王建周→首次封建→三監之亂→周公東征→營建洛邑並二次封建。", "pt": "西周初年次序", "id": "q022", "chId": "c1-feudal", "ch": "第二章 · 西周的封建", "chapterTitle": "西周的封建", "imgData": "", "obj": true}, {"kp": "b1", "lv": "hard", "ty": "short", "q": "周公為何要推行第二次封建？", "pts": ["平定三監之亂後，需加强对新領地的控制。", "鞏固周室統治，防範商族及叛亂。", "分封宗室功臣，拱衛中央。"], "why": "考查第二次封建的背景與目的。", "pt": "二次封建目的", "id": "q023", "chId": "c1-feudal", "ch": "第二章 · 西周的封建", "chapterTitle": "西周的封建", "imgData": "", "obj": false}, {"kp": "b2", "lv": "easy", "ty": "mcq", "q": "西周封建制度下，諸侯爵位最高的等級是：", "opts": ["公", "侯", "伯", "子"], "ans": 0, "why": "諸侯爵位分為公、侯、伯、子、男五等，以「公」為最高。", "pt": "爵位等級", "id": "q024", "chId": "c1-feudal", "ch": "第二章 · 西周的封建", "chapterTitle": "西周的封建", "imgData": "", "obj": true}, {"kp": "b2", "lv": "core", "ty": "match", "q": "將輔行制度與其作用配對。", "L": ["宗法制度", "禮樂制度"], "R": ["規定權位由嫡長子繼承，確立尊卑關係", "規定祭祀婚喪的禮儀，維持封建秩序"], "ans": [0, 1], "why": "宗法制度規定嫡長子繼承；禮樂制度規範禮儀，兩者共同維持封建秩序。", "pt": "宗法禮樂作用", "id": "q025", "chId": "c1-feudal", "ch": "第二章 · 西周的封建", "chapterTitle": "西周的封建", "imgData": "", "obj": true}, {"kp": "b2", "lv": "hard", "ty": "source", "q": "資料：周天子擁有最高權威，諸侯須服從天子，但在其封國內享有自主權。天子會定期巡視封國，諸侯則要定期朝見天子、交納貢品，並在有需要時隨天子出征。", "sub": [{"q": "(a) 諸侯對天子負有哪些義務？試舉兩項。", "a": "定期朝見天子、交納貢品、隨天子出征或出兵保衛王室（任二）。"}, {"q": "(b) 這反映了封建制度下天子與諸侯怎樣的關係？", "a": "天子有最高權威，諸侯須服從，但在封國有自主權。"}], "why": "訓練從史料提取資訊及分析權責關係。", "pt": "史料提取：天子諸侯關係", "id": "q026", "chId": "c1-feudal", "ch": "第二章 · 西周的封建", "chapterTitle": "西周的封建", "imgData": "", "obj": false}, {"kp": "b3", "lv": "easy", "ty": "mcq", "q": "以下哪一項不是西周封建制度的作用？", "opts": ["鞏固統治", "擴展勢力", "民族融合", "削弱王室"], "ans": 3, "why": "封建制度的作用是鞏固統治、擴展勢力、促進民族融合，並非削弱王室。", "pt": "封建作用辨析", "id": "q027", "chId": "c1-feudal", "ch": "第二章 · 西周的封建", "chapterTitle": "西周的封建", "imgData": "", "obj": true}, {"kp": "b3", "lv": "core", "ty": "short", "q": "簡述封建制度如何促進民族融合。", "pts": ["周人勢力向周邊擴展，與蠻、夷、戎、狄等邊族交往日漸頻繁。", "與中原華夏民族交往，促進民族融合。", "華夏文化隨之傳播四方。"], "why": "考查封建制度在民族關係上的作用。", "pt": "民族融合", "id": "q028", "chId": "c1-feudal", "ch": "第二章 · 西周的封建", "chapterTitle": "西周的封建", "imgData": "", "obj": false}, {"kp": "b3", "lv": "hard", "ty": "essay", "q": "「西周封建制度有效地鞏固了周室的統治。」你同意嗎？試加以說明。", "rub": ["贊成：分封諸侯屏藩王室；宗法禮樂加強聯繫、建立階級分明的社會；擴展勢力、促進民族融合。", "保留：諸侯在封國有自主權，日後坐大，最終導致春秋戰國混亂。", "總結：初期有效鞏固統治，但長遠種下分裂隱患。"], "why": "訓練評價制度利弊的論述能力。", "pt": "評價封建制度", "id": "q029", "chId": "c1-feudal", "ch": "第二章 · 西周的封建", "chapterTitle": "西周的封建", "imgData": "", "obj": false}, {"kp": "b4", "lv": "easy", "ty": "match", "q": "將「春秋五霸」與其稱號配對（部分）。", "L": ["齊桓公", "晉文公", "楚莊王"], "R": ["春秋第一位霸主", "城濮之戰後稱霸", "問鼎中原，一度稱霸"], "ans": [0, 1, 2], "why": "齊桓公是春秋首霸；晉文公城濮之戰後稱霸；楚莊王問鼎中原。", "pt": "春秋五霸", "id": "q030", "chId": "c1-feudal", "ch": "第二章 · 西周的封建", "chapterTitle": "西周的封建", "imgData": "", "obj": true}, {"kp": "b4", "lv": "core", "ty": "mcq", "q": "春秋霸主提出的口號是：", "opts": ["尊王攘夷", "兼愛非攻", "無為而治", "遠交近攻"], "ans": 0, "why": "霸主以「尊王攘夷」為口號，尊重周室、抵禦蠻族，爭取諸侯擁戴。", "pt": "尊王攘夷", "id": "q031", "chId": "c1-feudal", "ch": "第二章 · 西周的封建", "chapterTitle": "西周的封建", "imgData": "", "obj": true}, {"kp": "b4", "lv": "hard", "ty": "short", "q": "說明封建制度崩壞與春秋戰國局面形成的關係。", "pts": ["平王東遷後周室衰弱，王畿縮小、經濟軍事力下降。", "天子威望下降，諸侯不再尊重王室，僭越禮制。", "諸侯坐大，互相兼并，形成春秋戰國混亂局面。"], "why": "考查因果關係與歷史解釋。", "pt": "封建崩壞與春秋戰國", "id": "q032", "chId": "c1-feudal", "ch": "第二章 · 西周的封建", "chapterTitle": "西周的封建", "imgData": "", "obj": false}, {"kp": "b5", "lv": "easy", "ty": "mcq", "q": "「三家分晉」標誌了哪個時期的開始？", "opts": ["春秋時期", "戰國時期", "西周時期", "秦漢時期"], "ans": 1, "why": "公元前453年韓、趙、魏三家分晉，周天子正式冊封，標誌戰國時期開始。", "pt": "三家分晉", "id": "q033", "chId": "c1-feudal", "ch": "第二章 · 西周的封建", "chapterTitle": "西周的封建", "imgData": "", "obj": true}, {"kp": "b5", "lv": "core", "ty": "match", "q": "將「戰國七雄」與其所在方位配對。", "L": ["秦", "齊", "楚", "燕"], "R": ["西方", "東方", "南方", "北方"], "ans": [0, 1, 2, 3], "why": "秦在西方、齊在東方、楚在南方、燕在北方，其餘為趙、魏、韓。", "pt": "戰國七雄方位", "id": "q034", "chId": "c1-feudal", "ch": "第二章 · 西周的封建", "chapterTitle": "西周的封建", "imgData": "", "obj": true}, {"kp": "b5", "lv": "hard", "ty": "order", "q": "將以下事件按先後排列。", "items": ["春秋五霸稱霸", "三家分晉，戰國開始", "戰國七雄並立", "秦國統一天下（前221年）"], "ans": [0, 1, 2, 3], "why": "春秋稱霸→三家分晉（戰國開始）→七雄並立→秦統一。", "pt": "春秋至戰國次序", "id": "q035", "chId": "c1-feudal", "ch": "第二章 · 西周的封建", "chapterTitle": "西周的封建", "imgData": "", "obj": true}, {"kp": "b5", "lv": "core", "ty": "short", "q": "「三家分晉」標誌戰國時代的開始。試指出是哪三家瓜分了晉國，並說明此事件的歷史意義。", "pts": ["韓、趙、魏三家瓜分晉國。", "標誌著春秋時代結束、戰國時代開始；從此諸侯兼併更為激烈，形成戰國七雄並立的局面。"], "why": "考查戰國起始標誌的具體史實（三家為韓、趙、魏），及其在時代劃分上的意義。", "pt": "三家分晉", "id": "q036", "chId": "c1-feudal", "ch": "第二章 · 西周的封建", "chapterTitle": "西周的封建", "imgData": "", "obj": false}]}, {"id": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "title": "春秋戰國時期的變局", "pages": "pp.28–43", "src": "", "unit": "u1", "unitTitle": "單元一 · 史前至夏商周", "kps": {"d1": "兼併戰爭的變化：規模、軍事制度、戰術、兵器", "d2": "各國變法與商鞅變法的內容及成效", "d3": "百家爭鳴的背景與儒墨道法四家主張", "d4": "人物個案：孔子、勾踐、蘇秦、荊軻與時代關係"}, "qs": [{"kp": "d1", "lv": "easy", "ty": "mcq", "q": "戰國時期逐漸成為主要兵種的是：", "opts": ["戰車", "步兵和騎兵", "象兵", "水軍"], "ans": 1, "why": "戰國以來戰場擴大、地形複雜，步兵和騎兵逐漸成為主要兵種。", "pt": "兵種變化", "id": "q037", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": true}, {"kp": "d1", "lv": "core", "ty": "compare", "q": "比較春秋與戰國時期的兼并戰爭。", "head": ["項目", "春秋時期", "戰國時期"], "rows": [["戰爭規模", "較小、時間短、士兵數千至萬", "較大、可長達數年、動員數萬至數十萬"], ["將士來源", "主要來自貴族", "大規模徵召平民，甚至婦女老弱"], ["戰略戰術", "戰車為主、步兵為副", "步兵騎兵為主，戰術多樣"], ["兵器", "青銅兵器為主", "青銅與鐵製兵器並用，弩的出現"]], "why": "考查戰爭變化的多方面比較。", "pt": "春秋戰國戰爭比較", "id": "q038", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": false}, {"kp": "d1", "lv": "hard", "ty": "source", "q": "資料：戰國以來，各國大規模徵召平民當兵，甚至動員婦女、老弱參戰，軍隊人數隨之增加。有些國家還利用爵位、田宅等，鼓勵將士勇殺敵。", "sub": [{"q": "(a) 戰國時期軍隊人數增加的原因為何？", "a": "大規模徵召平民，甚至動員婦女老弱參戰。"}, {"q": "(b) 這反映了軍事制度怎樣的變化？", "a": "由貴族參戰轉向徵召平民，並以爵位田宅獎勵軍功。"}], "why": "訓練從史料分析軍事制度變革。", "pt": "史料提取：軍事變革", "id": "q039", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": false}, {"kp": "d2", "lv": "easy", "ty": "mcq", "q": "戰國時期成效最顯著的變法是：", "opts": ["管仲改革", "商鞅變法", "王安石變法", "張居正改革"], "ans": 1, "why": "戰國時期秦國商鞅變法成效最為顯著，奠定秦國統一天下的基礎。", "pt": "商鞅變法", "id": "q040", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": true}, {"kp": "d2", "lv": "core", "ty": "match", "q": "將商鞅變法的措施與其作用配對。", "L": ["獎勵軍功", "推行縣制", "統一度量衡", "行連坐法"], "R": ["提升軍隊戰鬥力", "加強中央集權", "便利經濟交流", "加強對百姓控制"], "ans": [0, 1, 2, 3], "why": "獎勵軍功提升戰力；縣制加强集權；統一度量衡便利經濟；連坐法加強控制。", "pt": "商鞅變法措施配對", "id": "q041", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": true}, {"kp": "d2", "lv": "hard", "ty": "essay", "q": "商鞅變法如何使秦國富強？試說明之。", "rub": ["經濟：鼓勵耕織、承認土地私有、統一度量衡，促進農業發展。", "軍事：獎勵軍功、取消世襲爵位，提升軍隊戰鬥力。", "政治：推行縣制、嚴格法治、連坐法，加強中央集權與控制。", "總結：秦國國力大增，奠定日後統一天下的基礎。"], "why": "訓練綜合分析變法成效的論述能力。", "pt": "商鞅變法成效論述", "id": "q042", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": false}, {"kp": "d2", "lv": "core", "ty": "source", "q": "資料：商鞅在城南門豎立一根木頭，宣布能搬到北門者賞五十金。百姓懷疑，商鞅再提高賞金，終於有人試之並如約獲賞。", "sub": [{"q": "(a) 這個「徙木立信」故事說明商鞅甚麼品質？", "a": "誠信、言出必行。"}, {"q": "(b) 此做法對推行變法有何幫助？", "a": "建立政府信譽，讓百姓相信政令，樂於遵守。"}], "why": "考查從史料理解變法策略與價值觀。", "pt": "徙木立信", "id": "q043", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": false}, {"kp": "d3", "lv": "easy", "ty": "mcq", "q": "主張「兼愛」「非攻」的是哪一學派？", "opts": ["儒家", "墨家", "道家", "法家"], "ans": 1, "why": "墨家代表人物墨子，主張兼愛（不分親疏愛人如己）、非攻（反對侵略戰爭）。", "pt": "墨家主張", "id": "q044", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": true}, {"kp": "d3", "lv": "core", "ty": "match", "q": "將學派與其代表人物配對。", "L": ["儒家", "墨家", "道家", "法家"], "R": ["孔子、孟子、荀子", "墨子", "老子、莊子", "韓非子"], "ans": [0, 1, 2, 3], "why": "儒家孔孟荀、墨家墨子、道家老莊、法家韓非子。", "pt": "學派與人物配對", "id": "q045", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": true}, {"kp": "d3", "lv": "core", "ty": "short", "q": "簡述百家爭鳴出現的背景。", "pts": ["諸侯求賢：封建崩壞、列國爭雄，各國招攬人才，士人著書立說。", "教育普及：貴族淪為平民，民間講學興起，平民知識分子出現。", "經濟富裕：社會繁榮，貴族供養士人，交通發達有利思想交流。"], "why": "考查百家爭鳴背景的多角度理解。", "pt": "百家爭鳴背景", "id": "q046", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": false}, {"kp": "d3", "lv": "hard", "ty": "essay", "q": "「儒、墨、道、法四家針對春秋戰國的亂局，提出了不同的治國主張。」試比較四家的主張。", "rub": ["儒家：仁義、仁政德治、以禮規範，代表人物孔子等。", "墨家：兼愛、非攻、節用、尚賢，代表墨子。", "道家：道法自然、無為而治、追求精神自由，代表老莊。", "法家：重視法令刑罰、加強君權、獎勵耕戰，代表韓非子。"], "why": "考查對四家思想的綜合比較與論述。", "pt": "四家主張比較論述", "id": "q047", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": false}, {"kp": "d4", "lv": "easy", "ty": "mcq", "q": "「臥薪嘗膽」最終滅吳稱霸的春秋末年是誰？", "opts": ["孔子", "勾踐", "蘇秦", "荊軻"], "ans": 1, "why": "越王勾踐被吳打敗後臥薪嘗膽，经过十年努力最終滅吳，成為春秋最後一位霸主。", "pt": "勾踐臥薪嘗膽", "id": "q048", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": true}, {"kp": "d4", "lv": "core", "ty": "match", "q": "將人物與其事迹配對。", "L": ["孔子", "蘇秦", "荊軻"], "R": ["開設私學、修訂六經、提出仁政德治", "倡議合縱對抗強秦，佩六國相印", "為燕太子丹刺殺秦王，事敗被殺"], "ans": [0, 1, 2], "why": "孔子為思想家教育家；蘇秦為縱橫家倡合縱；荊軻為刺客刺秦王。", "pt": "人物事跡配對", "id": "q049", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": true}, {"kp": "d4", "lv": "hard", "ty": "source", "q": "資料：孔子生於沒落的貴族家庭，年輕時曾任魯國小官，其後離開魯國，周遊列國，向各國國君宣揚自己的主張，但始終未獲重用，晚年返回魯國，專注修書和講學。", "sub": [{"q": "(a) 孔子的政治主張未能實現，他如何應對？", "a": "晚年返魯，專注修訂六經、開設私學、教化弟子。"}, {"q": "(b) 孔子事迹反映了春秋時期哪些社會現象？", "a": "貴族沒落、平民興起、私人講學風氣盛、諸侯求賢。"}], "why": "考查從史料分析人物與時代的關係。", "pt": "史料提取：孔子與時代", "id": "q050", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": false}, {"kp": "d3", "lv": "easy", "ty": "mcq", "q": "主張「無為而治」，認為統治者應減少干預百姓生活的學派是：", "opts": ["儒家", "墨家", "道家", "法家"], "ans": 2, "why": "道家（老子、莊子）主張順應自然、無為而治；儒家主張仁禮、墨家主張兼愛非攻、法家主張以法治國。", "pt": "道家無為而治", "id": "q051", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": true}, {"kp": "d3", "lv": "core", "ty": "match", "q": "將先秦思想家與其所屬學派配對。", "L": ["孔子", "墨子", "老子、莊子", "韓非"], "R": ["儒家：仁、禮", "墨家：兼愛、非攻", "道家：無為而治", "法家：以法治國"], "ans": [0, 1, 2, 3], "why": "儒家的孔子主張仁禮，墨家的墨子主張兼愛非攻，道家的老子與莊子主張無為，法家的韓非主張法治。", "pt": "思想家與學派配對", "id": "q052", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": true}, {"kp": "d4", "lv": "core", "ty": "short", "q": "簡述縱橫家蘇秦的主要事迹，並說明其所處的時代背景。", "pts": ["蘇秦游說六國合縱抗秦，一時身佩六國相印。", "身處戰國時期，秦國東侵威脅六國，各國尋求合縱抗秦或連橫事秦的策略。"], "why": "考查戰國縱橫家人物個案，聯繫合縱連橫的時代背景。", "pt": "蘇秦與合縱", "id": "q053", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": false}, {"kp": "d4", "lv": "hard", "ty": "source", "q": "資料：戰國末期，燕太子丹遣荊軻攜帶燕國督亢地圖及樊於期首級入秦，假意獻地求和，圖中藏匕首，圖窮匕見，荊軻刺秦王政不中，事敗被殺。", "sub": [{"q": "(a) 荊軻入秦的公開目的是甚麼？", "a": "假意獻出燕國督亢地圖及樊於期首級，向秦求和。"}, {"q": "(b) 荊軻的真正目的是甚麼？反映了戰國末期怎樣的形勢？", "a": "真正目的是刺殺秦王政；反映秦國東侵、六國危急，燕國力圖以非常手段挽救滅亡的形勢。"}], "why": "以荊軻刺秦的史料考查戰國末期人物個案與秦統一前夕的形勢。", "pt": "史料研習：荊軻刺秦", "id": "q054", "chId": "c1-warring", "ch": "第三章 · 春秋戰國時期的變局", "chapterTitle": "春秋戰國時期的變局", "imgData": "", "obj": false}]}, {"id": "c2-qin", "ch": "第一章 · 秦朝的統一、統治措施及衰亡", "title": "秦朝的統一、統治措施及衰亡", "pages": "pp.46–62", "src": "", "unit": "u2", "unitTitle": "單元二 · 秦漢", "kps": {"e1": "秦統一六國的過程、策略（合縱連橫、遠交近攻、離間計）", "e2": "秦統一的原因：地理優勢、善用人才、民心趋向", "e3": "秦朝統治措施：中央集權、統一文字、焚書坑儒、厲行法治", "e4": "統一貨幣、度量衡、修長城、開發嶺南及其影響", "e5": "秦亡經過、原因（嚴刑峻法、稅役繁重、遺民反秦）與楚漢相爭"}, "qs": [{"kp": "e1", "lv": "easy", "ty": "mcq", "q": "公元前221年完成統一天下的是誰？", "opts": ["秦始皇（秦王嬴政）", "漢高祖劉邦", "周武王", "商湯"], "ans": 0, "why": "秦王嬴政在位時先後吞併六國，於公元前221年完成統一，自稱「始皇帝」。", "pt": "秦統一時間人物", "id": "q055", "chId": "c2-qin", "ch": "第一章 · 秦朝的統一、統治措施及衰亡", "chapterTitle": "秦朝的統一、統治措施及衰亡", "imgData": "", "obj": true}, {"kp": "e1", "lv": "core", "ty": "match", "q": "將秦國的外交策略與其內容配對。", "L": ["合縱", "連橫", "遠交近攻", "離間計"], "R": ["東方六國聯合抗秦", "秦國游說各國分别与秦合作", "與遠方齊楚交好，攻打鄰近韓魏", "分化六國君臣關係"], "ans": [0, 1, 2, 3], "why": "合縱是六國抗秦；連橫是秦瓦解合縱；遠交近攻與離間計均為秦國策略。", "pt": "外交策略配對", "id": "q056", "chId": "c2-qin", "ch": "第一章 · 秦朝的統一、統治措施及衰亡", "chapterTitle": "秦朝的統一、統治措施及衰亡", "imgData": "", "obj": true}, {"kp": "e1", "lv": "core", "ty": "order", "q": "將秦滅六國的次序排列。", "items": ["韓", "趙", "魏", "楚", "燕", "齊"], "ans": [0, 1, 2, 3, 4, 5], "why": "秦先後吞併韓、趙、魏、楚、燕、齊，於前221年完成統一。", "pt": "秦滅六國次序", "id": "q057", "chId": "c2-qin", "ch": "第一章 · 秦朝的統一、統治措施及衰亡", "chapterTitle": "秦朝的統一、統治措施及衰亡", "imgData": "", "obj": true}, {"kp": "e1", "lv": "hard", "ty": "source", "q": "資料：戰國後期，秦國在長平之戰打敗唯一能與秦抗衡的趙國，從此六國再無力抵擋秦國。", "sub": [{"q": "(a) 長平之戰的結果如何？", "a": "秦國打敗趙國。"}, {"q": "(b) 這場戰役對秦統一有何意義？", "a": "打敗唯一能抗秦的趙國，六國再無力抵擋，為統一掃除障礙。"}], "why": "考查從史料分析關鍵戰役的意義。", "pt": "史料提取：長平之戰", "id": "q058", "chId": "c2-qin", "ch": "第一章 · 秦朝的統一、統治措施及衰亡", "chapterTitle": "秦朝的統一、統治措施及衰亡", "imgData": "", "obj": false}, {"kp": "e2", "lv": "easy", "ty": "mcq", "q": "秦國能統一六國的地理優勢不包括：", "opts": ["據有關中巴蜀，土地肥沃", "地勢險要，易守難攻", "地處黃河上游", "位處東方平原，交通便利"], "ans": 3, "why": "秦位處黃河上游，據關中巴蜀，地勢險要易守難攻；並非位處東方平原。", "pt": "地理優勢辨析", "id": "q059", "chId": "c2-qin", "ch": "第一章 · 秦朝的統一、統治措施及衰亡", "chapterTitle": "秦朝的統一、統治措施及衰亡", "imgData": "", "obj": true}, {"kp": "e2", "lv": "core", "ty": "short", "q": "簡述秦國能統一六國的原因。", "pts": ["地理優勢：據關中巴蜀，土地肥沃、地勢險要，易守難攻。", "善用人才：用人不問出身國別，重用商鞅、張儀、范雎、李斯等客卿。", "民心趋向：人民渴望和平統一，工商業發展有利于通商，統一是大勢所趨。"], "why": "考查統一原因的多角度归纳。", "pt": "統一原因", "id": "q060", "chId": "c2-qin", "ch": "第一章 · 秦朝的統一、統治措施及衰亡", "chapterTitle": "秦朝的統一、統治措施及衰亡", "imgData": "", "obj": false}, {"kp": "e2", "lv": "hard", "ty": "essay", "q": "「秦能統一六國，主要是因為地理位置優越。」你同意嗎？試說明之。", "rub": ["地理優勢：關中巴蜀、地勢險要、较少參與東方混戰，累積國力。", "善用人才：重用客卿，商鞅變法富強、張儀連橫、范雎遠交近攻、李斯離間。", "民心趋向：人民渴望和平，統一是時代趨勢。", "總結：地理是重要因素，但人才與民心同樣關鍵，不宜單歸因於地理。"], "why": "訓練評價歷史因素輕重的論述能力。", "pt": "統一原因評價", "id": "q061", "chId": "c2-qin", "ch": "第一章 · 秦朝的統一、統治措施及衰亡", "chapterTitle": "秦朝的統一、統治措施及衰亡", "imgData": "", "obj": false}, {"kp": "e3", "lv": "easy", "ty": "mcq", "q": "秦朝中央政府號稱「三公」，不包括下列哪一項？", "opts": ["丞相", "太尉", "御史大夫", "縣令"], "ans": 3, "why": "三公為丞相（理政）、太尉（掌軍事）、御史大夫（監察）；縣令是地方官員。", "pt": "三公組成", "id": "q062", "chId": "c2-qin", "ch": "第一章 · 秦朝的統一、統治措施及衰亡", "chapterTitle": "秦朝的統一、統治措施及衰亡", "imgData": "", "obj": true}, {"kp": "e3", "lv": "core", "ty": "match", "q": "將秦朝鞏固統一的文化措施與其內容配對。", "L": ["統一文字", "焚書坑儒", "厲行法治"], "R": ["以小篆為全國通行文字", "焚毀民間藏書、坑殺方士儒生", "以法家治國、連坐法、嚴刑"], "ans": [0, 1, 2], "why": "統一文字用小篆；焚書坑儒統一思想；法治以法家思想配合連坐法。", "pt": "文化措施配對", "id": "q063", "chId": "c2-qin", "ch": "第一章 · 秦朝的統一、統治措施及衰亡", "chapterTitle": "秦朝的統一、統治措施及衰亡", "imgData": "", "obj": true}, {"kp": "e3", "lv": "hard", "ty": "source", "q": "資料：秦始皇為了統一思想，下令除了秦國史書、醫藥、占卜、種植的書籍外，其餘民間藏書一律交官府焚毀；又禁止人們私自講學和議論朝政。", "sub": [{"q": "(a) 秦始皇焚書時保留了哪些書籍？試舉兩類。", "a": "秦國史書、醫藥、占卜、種植的書籍（任二）。"}, {"q": "(b) 焚書坑儒對文化有何影響？", "a": "燒毀大量書籍，對文化傳承造成巨大損失；鉗制思想，不利學術發展。"}], "why": "考查從史料提取資訊及評價歷史影響。", "pt": "史料提取：焚書坑儒", "id": "q064", "chId": "c2-qin", "ch": "第一章 · 秦朝的統一、統治措施及衰亡", "chapterTitle": "秦朝的統一、統治措施及衰亡", "imgData": "", "obj": false}, {"kp": "e3", "lv": "core", "ty": "short", "q": "簡述秦朝中央集權制度的內容。", "pts": ["中央設三公九卿，分掌政務、軍事、監察及皇室事務。", "地方廢封建、設郡縣，官吏由皇帝任免，不可世襲。", "大小政務由皇帝裁決，權力集中於皇帝。"], "why": "考查中央集权制度的掌握。", "pt": "中央集权内容", "id": "q065", "chId": "c2-qin", "ch": "第一章 · 秦朝的統一、統治措施及衰亡", "chapterTitle": "秦朝的統一、統治措施及衰亡", "imgData": "", "obj": false}, {"kp": "e4", "lv": "easy", "ty": "mcq", "q": "秦朝統一的圓形方孔銅錢稱為：", "opts": ["半兩錢", "五銖錢", "開元通寶", "交子"], "ans": 0, "why": "秦始皇統一貨幣，以銅錢為下幣，每枚半兩，称「半兩錢」，圓形方孔。", "pt": "半兩錢", "id": "q066", "chId": "c2-qin", "ch": "第一章 · 秦朝的統一、統治措施及衰亡", "chapterTitle": "秦朝的統一、統治措施及衰亡", "imgData": "", "obj": true}, {"kp": "e4", "lv": "core", "ty": "compare", "q": "比較秦朝統一貨幣與統一度量衡的作用。", "head": ["措施", "內容", "主要作用"], "rows": [["統一貨幣", "黃金為上幣、銅錢半兩為下幣", "便利商業貿易、促進經濟交流"], ["統一度量衡", "官府監製統一的度、量、衡標準器", "便利課稅及貿易，確保公平"]], "why": "考查經濟措施的内容与作用比較。", "pt": "貨幣與度量衡比較", "id": "q067", "chId": "c2-qin", "ch": "第 // ---------- chip groups ----------
// opts: { initial:[keys], minOne:bool, actions:bool }
//   initial  — 默认选中的 key（不传=全选）
//   minOne   — 是否至少保留一个（章节可清空，故传 false）
//   actions  — 是否显示 All / Reset 快捷按钮
function makeChips(container, items, opts, onChange){
  opts = opts || {};
  const allKeys = items.map(i=>i.key);
  const state = new Set(opts.initial !== undefined ? opts.initial : allKeys);
  const minOne = opts.minOne !== false;
  function render(){
    container.innerHTML='';
    let lastGroup=null;
    items.forEach(it=>{
      if(it.group && it.group!==lastGroup){
        const g=document.createElement('div'); g.className='chip-group'; g.textContent=it.group; container.appendChild(g); lastGroup=it.group;
      }
      const b=document.createElement('span');
      b.className='chip'+(state.has(it.key)?' on':'');
      b.textContent=it.label;
      b.addEventListener('click',()=>{
        if(state.has(it.key)){ if(!minOne || state.size>1) state.delete(it.key); }
        else state.add(it.key);
        render(); onChange([...state]);
      });
      container.appendChild(b);
    });
    if(opts.actions){
      const sep=document.createElement('span'); sep.className='chip-sep'; sep.textContent='|'; container.appendChild(sep);
      const all=document.createElement('span'); all.className='chip chip-act'; all.textContent='全部章節';
      all.title='選擇所有章節';
      all.addEventListener('click',()=>{ allKeys.forEach(k=>state.add(k)); render(); onChange([...state]); });
      container.appendChild(all);
      const rst=document.createElement('span'); rst.className='chip chip-act'; rst.textContent='清空';
      rst.title='清空所有已選章節';
      rst.addEventListener('click',()=>{ state.clear(); render(); onChange([...state]); });
      container.appendChild(rst);
    }
  }
  render();
  return state;
}
function makeLvChips(container,onChange,initial){
  const state=new Set(initial || ['easy','core','hard']);
  function render(){
    container.innerHTML='';
    [['easy','🌱 基本'],['core','📘 核心'],['hard','🏔️ 挑戰']].forEach(([k,l])=>{
      const b=document.createElement('span');
      b.className='chip'+(state.has(k)?' on':'');
      b.textContent=l;
      b.addEventListener('click',()=>{
        if(state.has(k)){ if(state.size>1)state.delete(k);} else state.add(k);
        render();onChange([...state]);
      });
      container.appendChild(b);
    });
  }
  render();return state;
}

// ---------- Random paper generation ----------
// 章節默認一個都不選（用戶需點選或 全部章節）；難度默認只選 基本
let genState={ch:new Set(),lv:new Set(['easy'])};
const chChips=makeChips(document.getElementById('chChips'),DATA.chapters.map(c=>({key:c.id,label:c.ch,group:c.unitTitle})),
  {initial:[], minOne:false, actions:true}, s=>{genState.ch=new Set(s);updPool();});
const lvChips=makeLvChips(document.getElementById('lvChips'),s=>{genState.lv=new Set(s);updPool();},['easy']);
function pool(){return ALLQ.filter(q=>genState.ch.has(q.chId)&&genState.lv.has(q.lv));}
function updPool(){
  const el=document.getElementById('poolStat');
  if(!genState.ch.size){ el.textContent='尚未選擇章節 — 請點選章節或按「全部章節」'; return; }
  el.textContent='可用題數：'+pool().length;
}
updPool();

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function pickQuestions(){
  const p=pool(); const num=parseInt(document.getElementById('numSel').value);
  const mode=document.getElementById('modeSel').value;
  let chosen;
  if(mode==='balanced'&&num>0){
    // Split evenly across the three levels
    const groups={easy:shuffle(p.filter(q=>q.lv==='easy')),core:shuffle(p.filter(q=>q.lv==='core')),hard:shuffle(p.filter(q=>q.lv==='hard'))};
    const per=Math.floor(num/3),rem=num-per*3;
    chosen=[...groups.easy.splice(0,per),...groups.core.splice(0,per),...groups.hard.splice(0,per)];
    for(const k of ['easy','core','hard']){while(chosen.length<num&&groups[k].length)chosen.push(groups[k].shift());}
    chosen=shuffle(chosen);
  } else if(mode==='easy'){chosen=shuffle(p.filter(q=>q.lv==='easy')).slice(0,num||999);}
  else if(mode==='hard'){chosen=shuffle(p.filter(q=>q.lv==='hard')).slice(0,num||999);}
  else {chosen=shuffle(p).slice(0,num||p.length);}
  return chosen;
}

function imgHtml(q){
  if(!q.imgData)return '';
  return `<figure class="qfig"><img src="${q.imgData}" alt=""><figcaption>${esc(q.cap||'')}</figcaption></figure>`;
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function qMeta(q){
  return `<span class="qno">Q__N__</span><span class="badge lv-${q.lv}">${LVN[q.lv]}</span><span class="ty-b">${TYN[q.ty]}</span><span class="kp-b">${esc(q.ch)} · ${esc(DATA.chapters.find(c=>c.id===q.chId).kps[q.kp]||q.kp)}</span>`;
}

function renderPaperQuestion(q,idx){
  let body='';
  if(q.ty==='mcq'){
    const L='ABCDEFGH';
    body=q.opts.map((o,i)=>`<div class="optpick" data-i="${i}"><span class="rd"></span><span>${L[i]}. ${esc(o)}</span></div>`).join('');
  }else if(q.ty==='match'){
    const opts=q.R.map((r,i)=>`<option value="${i}">${esc(r)}</option>`).join('');
    body=`<div class="match2">`+q.L.map((l,i)=>`<div class="mt">${esc(l)}<select class="matchsel" data-i="${i}"><option value="-1">— 請選擇 —</option>${opts}</select></div>`).join('')+`</div>`;
  }else if(q.ty==='order'){
    const items=shuffle(q.items.map((t,i)=>({t,orig:i})));
    body=`<div class="orderbox" data-answer='${JSON.stringify(q.ans)}'>`+items.map(it=>`<div class="orderitem" data-orig="${it.orig}"><span class="ov"></span><span class="otxt">${esc(it.t)}</span><button class="mvbtn" data-dir="-1">↑</button><button class="mvbtn" data-dir="1">↓</button></div>`).join('')+`</div>`;
  }else if(q.ty==='source'){
    body=q.sub.map((s,i)=>`<div class="stem">${esc(s.q)}</div><textarea class="ans-ta" data-sub="${i}" placeholder="寫下你的答案…"></textarea>`).join('');
  }else if(q.ty==='short'){
    body=`<textarea class="ans-ta" placeholder="寫下 1–2 點…"></textarea>`;
  }else if(q.ty==='essay'){
    body=`<textarea class="ans-ta" style="min-height:130px" placeholder="寫一篇短文（2–3 段）…"></textarea>`;
  }else if(q.ty==='compare'){
    body=`<table class="cmp"><thead><tr>${q.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${q.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="ref">（供參考的比較表，可作為作答框架。）</div>`;
  }
  const meta=qMeta(q).replace('__N__',idx+1);
  return `<div class="pq" data-id="${q.id}" data-ty="${q.ty}">
    <div class="qtop">${meta}</div>
    <div class="stem">${esc(q.q)}</div>
    ${imgHtml(q)}
    <div class="answer-line">${body}</div>
    <div class="fb-slot"></div>
  </div>`;
}

function genPaper(){
  const chosen=pickQuestions();
  if(!chosen.length){
    const msg = !genState.ch.size
      ? '尚未選擇章節。請在上方點選至少一個章節，或按「全部章節」。'
      : '沒有符合目前條件的題目，請放寬篩選條件。';
    document.getElementById('paper').innerHTML='<div class="panel empty">'+msg+'</div>';
    return;
  }
  const now=new Date();
  const html=`<div class="panel" id="paperHead"><div class="paper-head">
     <div><h2>中國歷史 · 隨機測驗</h2><div class="stat">${chosen.length} 題 · 生成於 ${now.toLocaleString('en-GB')}</div></div>
     <div class="no-print"><button class="btn gray" id="printBtn">🖨️ 列印</button></div>
   </div><div class="row"><span class="lbl">姓名：</span><span style="border-bottom:1px solid #ccc;min-width:160px">&nbsp;</span><span class="lbl" style="min-width:auto">日期：</span><span style="border-bottom:1px solid #ccc;min-width:120px">&nbsp;</span></div></div>
   <div id="paperQs">${chosen.map((q,i)=>renderPaperQuestion(q,i)).join('')}</div>
   <div class="scorebar no-print"><span class="stat">客觀題自動批改；主觀題於提交後顯示參考答案</span><button class="btn teal" id="submitBtn">✅ 提交並批改</button><span class="score" id="scoreText"></span></div>`;
  document.getElementById('paper').innerHTML=html;
  document.getElementById('regenBtn').style.display='';
  document.getElementById('printBtn2').style.display='';
  document.getElementById('submitBtn').addEventListener('click',gradePaper);
  document.getElementById('printBtn').addEventListener('click',()=>window.print());
  bindPaperEvents();
  document.getElementById('paperHead').scrollIntoView({behavior:'smooth'});
}
document.getElementById('genBtn').addEventListener('click',genPaper);
document.getElementById('regenBtn').addEventListener('click',genPaper);

function bindPaperEvents(){
  document.querySelectorAll('.pq').forEach(pq=>{
    const ty=pq.dataset.ty;
    if(ty==='mcq'){
      pq.querySelectorAll('.optpick').forEach(op=>op.addEventListener('click',()=>{
        pq.querySelectorAll('.optpick').forEach(x=>x.classList.remove('sel'));
        op.classList.add('sel');
      }));
    }else if(ty==='order'){
      pq.querySelectorAll('.mvbtn').forEach(b=>b.addEventListener('click',()=>{
        const it=b.closest('.orderitem'); const box=it.parentElement;
        const dir=parseInt(b.dataset.dir);
        if(dir<0&&it.previousElementSibling)box.insertBefore(it,it.previousElementSibling);
        else if(dir>0&&it.nextElementSibling)box.insertBefore(it.nextElementSibling,it);
        renumberOrder(box);
      }));
      renumberOrder(pq.querySelector('.orderbox'));
    }
  });
}
function renumberOrder(box){
  [...box.querySelectorAll('.orderitem')].forEach((it,i)=>it.querySelector('.ov').textContent=i+1);
}

function gradePaper(){
  let score=0,total=0,details=[];
  document.querySelectorAll('.pq').forEach(pq=>{
    const q=ALLQ.find(x=>x.id===pq.dataset.id); const ty=pq.dataset.ty;
    const slot=pq.querySelector('.fb-slot');
    let ok=null,msg='';
    if(ty==='mcq'){
      total++;
      const sel=pq.querySelector('.optpick.sel');
      const got=sel?parseInt(sel.dataset.i):-1;
      ok=(got===q.ans);
      if(ok)score++;
      pq.querySelectorAll('.optpick').forEach(op=>{
        const i=parseInt(op.dataset.i);
        if(i===q.ans)op.classList.add('mk-correct');
        else if(i===got)op.classList.add('mk-wrong');
      });
      const L='ABCDEFGH';
      msg=`正確答案：${L[q.ans]}。${esc(q.opts[q.ans])}`;
    }else if(ty==='match'){
      total++;
      const sels=[...pq.querySelectorAll('.matchsel')];
      const got=sels.map(s=>parseInt(s.value));
      ok=JSON.stringify(got)===JSON.stringify(q.ans);
      if(ok)score++;
      msg='正確配對：'+q.L.map((l,i)=>`${esc(l)} → ${esc(q.R[q.ans[i]])}`).join('; ');
    }else if(ty==='order'){
      total++;
      const got=[...pq.querySelectorAll('.orderitem')].map(it=>parseInt(it.dataset.orig));
      ok=JSON.stringify(got)===JSON.stringify(q.ans);
      if(ok)score++;
      msg='正確次序：'+q.ans.map((o,i)=>`${i+1}. ${esc(q.items[o])}`).join(' → ');
    }
    // Feedback and references
    let html='';
    if(ok===true)html+=`<div class="feedback fb-ok">✅ 正確</div>`;
    else if(ok===false)html+=`<div class="feedback fb-no">❌ 錯誤 · ${msg}</div>`;
    // Subjective questions and references
    if(!q.obj){
      html+=`<div class="ref"><b>參考答案：</b>${q.sub?('<ul>'+q.sub.map(s=>`<li><b>${esc(s.q)}</b> ${esc(s.a)}</li>`).join('')+'</ul>'):''}${q.pts?('<ul>'+q.pts.map(p=>`<li>${esc(p)}</li>`).join('')+'</ul>'):''}${q.rub?('<b>給分要點：</b><ul>'+q.rub.map(p=>`<li>${esc(p)}</li>`).join('')+'</ul>'):''}</div>`;
    }
    html+=`<div class="ref"><b>解析：</b>${esc(q.why)}　<b>知識點：</b>${esc(q.pt)}</div>`;
    slot.innerHTML=html;
  });
  document.getElementById('scoreText').textContent=`客觀題：${score}/${total}`+(total?` (${Math.round(score/total*100)}%)`:'');
  document.getElementById('paperHead').scrollIntoView({behavior:'smooth'});
}

// ---------- iframe auto-height (no-op when opened standalone) ----------
(function(){
  if (window.parent === window) return;
  var last = 0;
  function report(){
    var h = Math.max(document.documentElement.scrollHeight, document.body ? document.body.scrollHeight : 0);
    if (h && Math.abs(h - last) > 2){
      last = h;
      try { window.parent.postMessage({type:'histQBHeight', height:h}, '*'); } catch(e){}
    }
  }
  window.addEventListener('load', function(){ setTimeout(report, 60); });
  window.addEventListener('resize', report);
  if (window.ResizeObserver){ try { new ResizeObserver(report).observe(document.documentElement); } catch(e){} }
  ['click','input','change'].forEach(function(ev){ document.addEventListener(ev, function(){ setTimeout(report, 80); }, true); });
  setInterval(report, 500);
})();
</script>
